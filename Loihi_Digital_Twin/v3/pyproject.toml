[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loihi-twin-v2"
version = "0.1.0"
description = "Source-backed Loihi-1 architectural digital-twin golden model"
requires-python = ">=3.10"
authors = [{name = "Diego"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
