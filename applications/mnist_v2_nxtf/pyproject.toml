[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loihi-twin-v2-mnist-nxtf"
version = "0.1.0"
description = "P08 NxTF-oriented deep MNIST workload for the Loihi digital twin v2"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["tensorflow>=2.21,<2.22"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mnist_v2_nxtf*"]
