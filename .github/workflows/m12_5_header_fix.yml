name: Fix M12.5 cycle header

on:
  push:
    branches:
      - agent/m12-5-fpga-characterization
    paths:
      - scripts/fix_m12_5_cycle_header.py
      - .github/workflows/m12_5_header_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-5-fpga-characterization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fix_m12_5_cycle_header.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Neuromorphic Digital Twin/src/neuromorphic_twin/fpga_characterization.py"
          git diff --cached --check
          git commit -m "Freeze M12.5 cycle TSV column order"
          git push origin HEAD:agent/m12-5-fpga-characterization
