name: M13.6 final candidate preflight once

on:
  push:
    branches:
      - agent/m13-6-adjudicate-freeze-findings
    paths:
      - .github/workflows/m13_6_final_preflight_once.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-6-adjudicate-freeze-findings
          fetch-depth: 0

      - name: Install complete project test environment
        run: python3 -m pip install -e 'Neuromorphic Digital Twin[dev,compare]'

      - name: Validate tracked M13.6 candidate
        working-directory: Neuromorphic Digital Twin
        run: python3 examples/validate_m13_6_findings.py

      - name: Prove candidate regeneration is byte-identical
        working-directory: Neuromorphic Digital Twin
        run: |
          python3 examples/generate_m13_6_findings.py
          cmp references/m13_6_findings.json build/m13_6/m13_6_findings.json

      - name: Focused M13.6 tests
        working-directory: Neuromorphic Digital Twin
        run: python3 -m pytest --override-ini addopts='' -q tests/test_m13_6_findings.py

      - name: Complete project regression
        working-directory: Neuromorphic Digital Twin
        run: python3 -m pytest --override-ini addopts='' -q

      - name: Verify branch does not alter frozen baseline
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD > /tmp/m13_6_files.txt
          cat /tmp/m13_6_files.txt
          if grep -E '^Neuromorphic Digital Twin/(hls/core_v1/|rtl/core_v1/|src/neuromorphic_twin/(arithmetic|core|model|neuron|specification|weights)\.py$|src/neuromorphic_twin/(fpga_|hls_conformance\.py))' /tmp/m13_6_files.txt; then
            echo 'ERROR: M13.6 changed a frozen computational/HLS/RTL/physical-validation path.' >&2
            exit 2
          fi

      - name: Remove one-shot preflight
        shell: bash
        run: |
          rm .github/workflows/m13_6_final_preflight_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/m13_6_final_preflight_once.yml
          git commit -m 'Complete M13.6 candidate preflight'
          git push origin HEAD:agent/m13-6-adjudicate-freeze-findings
