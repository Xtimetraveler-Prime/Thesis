name: Neuromorphic Accelerator v1 M02 independent LIF neural oracle (NO BOARD)

on:
  push:
    paths:
      - "Neuromorphic_Accelerator/v1/**"
      - ".github/workflows/neuromorphic_accelerator_m02_pc_only.yml"
  pull_request:
    paths:
      - "Neuromorphic_Accelerator/v1/**"
      - ".github/workflows/neuromorphic_accelerator_m02_pc_only.yml"
  workflow_dispatch:

jobs:
  m02-no-board:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Neuromorphic_Accelerator/v1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Compile neural reference without device toolchain
        run: python3 -m compileall -q src scripts tests
      - name: Run hard-expected and random cross-implementation LIF tests
        run: python3 -m unittest discover -s tests -p "test_m02*.py" -v
      - name: Reproduce independent original fixed LIF and randomized report
        run: |
          set -euo pipefail
          python3 scripts/m02_reference_check.py \
            --seed 20261107 --random-cases 50 \
            --out "$RUNNER_TEMP/m02_dense_vs_queued_pc_only.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"m02_dense_vs_queued_pc_only.json").read_text())
          assert result["total_cases"]==54
          assert result["status"]=="PC_ONLY_PROVISIONAL_M02_REFERENCE_NO_HARDWARE"
          assert all(row["equal_dense_vs_event_queue"] for row in result["cases"])
          assert result["cases"][0]["voltage_rows"]==[[3],[0],[2],[1]]
          assert result["cases"][0]["emitted_spikes"]==[[1,0]]
          assert result["cases"][1]["emitted_spikes"]==[[1,0],[3,0]]
          assert result["cases"][2]["emitted_spikes"]==[[0,0],[2,1],[3,0]]
          print("M02_4_FIXED_PLUS_50_RANDOM_REFERENCE_CASES_PASS=1")
          PY

      - name: Reject report overwrites and negative scenario counts
        run: |
          set -euo pipefail
          if python3 scripts/m02_reference_check.py --out "$RUNNER_TEMP/m02_dense_vs_queued_pc_only.json" >/dev/null 2>&1; then
            echo "ERROR: source JSON overwritten"; exit 1
          fi
          if python3 scripts/m02_reference_check.py --random-cases -1 >/dev/null 2>&1; then
            echo "ERROR: invalid scenario count accepted"; exit 1
          fi
          echo "M02_FAIL_CLOSED_REPORT_OUTPUT_PASS=1"

      - name: Preserve isolated M01 acceptance regression boundary
        run: python3 -m unittest discover -s tests -p "test_m01*.py" -q
      - name: Inspect no-board neural provenance and negative scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"src")
          from neuromorphic_accelerator_v1.m02_types import Network,Neuron,InputCurrent,SCHEMA
          from neuromorphic_accelerator_v1.m02_dense_reference import evaluate_dense
          from neuromorphic_accelerator_v1.m02_event_reference import evaluate_events
          net=Network((Neuron(threshold=5),),state_bits=8,decay_num=1,decay_den=2)
          inp=(InputCurrent(0,0,3),InputCurrent(1,0,4),InputCurrent(2,0,2))
          dense=evaluate_dense(net,inp,ticks=4)
          queue=evaluate_events(net,inp,ticks=4)
          assert dense==queue
          assert dense.voltage_rows==((3,),(0,),(2,),(1,))
          assert dense.emitted_spikes==((1,0),)
          print("M02_SCHEMA="+SCHEMA)
          print("M02_INDEPENDENT_NEURAL_HARD_GOLDEN_AND_EVENT_QUEUE_PASS=1")
          print("M02_CPU_ONLY_NO_HLS_NO_JTAG_NO_BOARD=1")
          PY

      - name: Upload independently checked M02 original model evidence
        uses: actions/upload-artifact@v4
        with:
          name: m02-lif-reference-original-pc-only
          path: ${{ runner.temp }}/m02_dense_vs_queued_pc_only.json
          if-no-files-found: error
          retention-days: 30
