name: M13.6 and M13 completion gate once

on:
  push:
    branches:
      - agent/m13-6-adjudicate-freeze-findings
    paths:
      - .github/workflows/m13_6_complete_once.yml

permissions:
  contents: write

jobs:
  close-m13:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-6-adjudicate-freeze-findings
          fetch-depth: 0

      - name: Install complete project test environment
        run: python3 -m pip install -e 'Neuromorphic Digital Twin[dev,compare]'

      - name: Revalidate exact independently tested candidate
        working-directory: Neuromorphic Digital Twin
        run: |
          python3 examples/validate_m13_6_findings.py
          rm -rf build/m13_6
          python3 examples/generate_m13_6_findings.py
          cmp references/m13_6_findings.json build/m13_6/m13_6_findings.json
          git diff --quiet dedd3adcffd4f6080bfbb17153110539d8d45061 -- references/m13_6_findings.json

      - name: Stage final M13.6 and M13 closure
        run: python3 'Neuromorphic Digital Twin/scripts/stage_m13_6_completion.py'

      - name: Validate deterministic closure record
        working-directory: Neuromorphic Digital Twin
        run: |
          python3 examples/validate_m13_6_closure.py
          python3 examples/generate_m13_6_closure.py --output build/m13_6/m13_6_closure.json
          cmp references/m13_6_closure.json build/m13_6/m13_6_closure.json

      - name: Focused M13.6 closure regression
        working-directory: Neuromorphic Digital Twin
        run: |
          python3 -m pytest --override-ini addopts='' -q \
            tests/test_m13_6_findings.py \
            tests/test_m13_6_closure.py

      - name: Complete project regression
        working-directory: Neuromorphic Digital Twin
        run: python3 -m pytest --override-ini addopts='' -q

      - name: Verify completion documentation
        shell: bash
        run: |
          grep -F '| M13 | Cross-validate and audit against Catalyst N1 | Complete | 2026-09-08 | 2026-09-10 |' MILESTONES.md
          grep -F '**Status:** Complete' MILESTONES.md | tail -n 1
          grep -F '**Complete — candidate findings independently reproduced and accepted on 2026-09-10; M13.6 and M13 are closed.**' 'Neuromorphic Digital Twin/docs/M13_6_FINAL_FINDINGS.md'
          grep -F '"status": "validated_complete"' 'Neuromorphic Digital Twin/references/m13_6_closure.json'

      - name: Verify frozen computational baseline remains untouched
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD > /tmp/m13_6_files.txt
          git diff --name-only >> /tmp/m13_6_files.txt
          sort -u /tmp/m13_6_files.txt -o /tmp/m13_6_files.txt
          cat /tmp/m13_6_files.txt
          if grep -E '^Neuromorphic Digital Twin/(hls/core_v1/|rtl/core_v1/|src/neuromorphic_twin/(arithmetic|core|model|neuron|specification|weights)\.py$|src/neuromorphic_twin/(fpga_|hls_conformance\.py))' /tmp/m13_6_files.txt; then
            echo 'ERROR: M13.6 closure changed a frozen computational/HLS/RTL/physical-validation path.' >&2
            exit 2
          fi

      - name: Commit closure and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/m13_6_complete_once.yml
          rm 'Neuromorphic Digital Twin/scripts/stage_m13_6_completion.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MILESTONES.md EXPERIMENTS.md \
            'Neuromorphic Digital Twin/docs/M13_6_FINAL_FINDINGS.md' \
            'Neuromorphic Digital Twin/references/m13_6_closure.json' \
            'Neuromorphic Digital Twin/scripts/stage_m13_6_completion.py' \
            .github/workflows/m13_6_complete_once.yml
          git commit -m 'Complete M13.6 and close M13 audit'
          git push origin HEAD:agent/m13-6-adjudicate-freeze-findings
