name: M13.6 candidate findings freeze once

on:
  push:
    branches:
      - agent/m13-6-adjudicate-freeze-findings
    paths:
      - .github/workflows/m13_6_candidate_freeze_once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-6-adjudicate-freeze-findings
          fetch-depth: 0

      - name: Install complete project test environment
        run: python3 -m pip install -e 'Neuromorphic Digital Twin[dev,compare]'

      - name: Generate tracked M13.6 candidate findings
        working-directory: Neuromorphic Digital Twin
        run: python3 examples/generate_m13_6_findings.py --output references/m13_6_findings.json --markdown build/m13_6/m13_6_findings.md

      - name: Stage milestone and experiment handoff
        run: python3 'Neuromorphic Digital Twin/scripts/stage_m13_6_candidate_docs.py'

      - name: Focused M13.6 adjudication tests
        working-directory: Neuromorphic Digital Twin
        run: python3 -m pytest --override-ini addopts='' -q tests/test_m13_6_findings.py

      - name: Complete project regression
        working-directory: Neuromorphic Digital Twin
        run: python3 -m pytest --override-ini addopts='' -q

      - name: Verify frozen computational baseline untouched
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD > /tmp/m13_6_files.txt
          git diff --name-only >> /tmp/m13_6_files.txt
          sort -u /tmp/m13_6_files.txt -o /tmp/m13_6_files.txt
          cat /tmp/m13_6_files.txt
          if grep -E '^Neuromorphic Digital Twin/(hls/core_v1/|rtl/core_v1/|src/neuromorphic_twin/(arithmetic|core|model|neuron|specification|weights)\.py$|src/neuromorphic_twin/(fpga_|hls_conformance\.py))' /tmp/m13_6_files.txt; then
            echo 'ERROR: M13.6 changed a frozen computational/HLS/RTL/physical-validation path.' >&2
            exit 2
          fi

      - name: Commit candidate evidence and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/m13_6_candidate_freeze_once.yml
          rm 'Neuromorphic Digital Twin/scripts/stage_m13_6_candidate_docs.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MILESTONES.md EXPERIMENTS.md \
            'Neuromorphic Digital Twin/references/m13_6_findings.json' \
            'Neuromorphic Digital Twin/scripts/stage_m13_6_candidate_docs.py' \
            .github/workflows/m13_6_candidate_freeze_once.yml
          git commit -m 'Freeze M13.6 candidate findings and experiment handoff'
          git push origin HEAD:agent/m13-6-adjudicate-freeze-findings
