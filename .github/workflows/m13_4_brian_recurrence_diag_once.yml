name: M13.4 Brian recurrence diagnostic once
on:
  push:
    branches: [agent/m13-4-directed-differential-probes]
    paths: ['.github/workflows/m13_4_brian_recurrence_diag_once.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-4-directed-differential-probes
          fetch-depth: 0
      - run: |
          cd 'Neuromorphic Digital Twin'
          python3 -m pip install -e '.[dev,compare]'
      - name: Probe recurrent scheduling
        run: |
          cd 'Neuromorphic Digital Twin'
          python3 - <<'PY'
          import numpy as np
          from brian2 import prefs, start_scope
          from brian2_loihi import LoihiNetwork, LoihiNeuronGroup, LoihiSpikeGeneratorGroup, LoihiSpikeMonitor, LoihiSynapses, synapse_sign_mode
          prefs.codegen.target = 'numpy'
          for delay in (0, 1, 2):
              start_scope()
              neurons = LoihiNeuronGroup(2, refractory=1, threshold_v_mant=4, decay_v=0, decay_I=4096)
              gen = LoihiSpikeGeneratorGroup(1, [0], [0])
              ext = LoihiSynapses(gen, neurons, w_exp=0, sign_mode=synapse_sign_mode.EXCITATORY, num_weight_bits=8)
              ext.connect(i=[0], j=[0]); ext.w=np.asarray([5], dtype=int)
              rec = LoihiSynapses(neurons, neurons, delay=delay, w_exp=0, sign_mode=synapse_sign_mode.EXCITATORY, num_weight_bits=8)
              rec.connect(i=[0], j=[1]); rec.w=np.asarray([5], dtype=int)
              mon=LoihiSpikeMonitor(neurons)
              net=LoihiNetwork(neurons, gen, ext, rec, mon)
              print('DIAG|delay=%d|schedule=%s' % (delay, ','.join(net.schedule)))
              for t in range(6):
                  before=len(mon.i); net.run(1)
                  spikes=[int(v) for v in mon.i[before:]]
                  print('DIAG|delay=%d|tick=%d|I=%s|V=%s|spikes=%s' % (delay,t,[int(round(float(v))) for v in neurons.I[:]],[int(round(float(v))) for v in neurons.v[:]],spikes))
          PY
      - name: Cleanup workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13_4_brian_recurrence_diag_once.yml
          git commit -m 'Remove temporary M13.4 Brian recurrence diagnostic'
          git push origin HEAD:agent/m13-4-directed-differential-probes
