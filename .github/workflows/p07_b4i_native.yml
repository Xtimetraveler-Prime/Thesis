name: P07-B.4i/B.4j isolated JTAG physical gates native safety
on:
  push:
    paths:
      - 'Loihi_Digital_Twin/v3/software/p07/p07_b4i_readonly_mailbox_board.c'
      - 'Loihi_Digital_Twin/v3/software/p07/build_p07_b4i.py'
      - 'Loihi_Digital_Twin/v3/scripts/build_p07_b4i.sh'
      - 'Loihi_Digital_Twin/v3/scripts/p07_b4i_physical_pilot.py'
      - 'Loihi_Digital_Twin/v3/scripts/p07_b4i_verify_mailbox.py'
      - 'Loihi_Digital_Twin/v3/vivado/p07_b4i_xsdb_run.tcl'
      - 'Loihi_Digital_Twin/v3/vivado/p07_b4i_stop_and_width_gate.tcl'
      - 'Loihi_Digital_Twin/v3/tests/test_p07_b4i_physical_pilot.py'
      - 'Loihi_Digital_Twin/v3/tests/test_p07_b4j_shell_program_pilot.py'
      - 'Loihi_Digital_Twin/v3/scripts/p07_b4j_shell_program_pilot.py'
      - '.github/workflows/p07_b4i_native.yml'
  pull_request:
    paths:
      - 'Loihi_Digital_Twin/v3/software/p07/p07_b4i_readonly_mailbox_board.c'
      - 'Loihi_Digital_Twin/v3/software/p07/build_p07_b4i.py'
      - 'Loihi_Digital_Twin/v3/scripts/build_p07_b4i.sh'
      - 'Loihi_Digital_Twin/v3/scripts/p07_b4i_physical_pilot.py'
      - 'Loihi_Digital_Twin/v3/scripts/p07_b4i_verify_mailbox.py'
      - 'Loihi_Digital_Twin/v3/vivado/p07_b4i_xsdb_run.tcl'
      - 'Loihi_Digital_Twin/v3/vivado/p07_b4i_stop_and_width_gate.tcl'
      - 'Loihi_Digital_Twin/v3/tests/test_p07_b4i_physical_pilot.py'
      - 'Loihi_Digital_Twin/v3/tests/test_p07_b4j_shell_program_pilot.py'
      - 'Loihi_Digital_Twin/v3/scripts/p07_b4j_shell_program_pilot.py'
      - '.github/workflows/p07_b4i_native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Synthetic-only no-board safety gates
        working-directory: Loihi_Digital_Twin/v3
        run: PYTHONPATH="$PWD/src" python -m pytest -q -rs tests/test_p07_b4i_physical_pilot.py tests/test_p07_b4j_shell_program_pilot.py
