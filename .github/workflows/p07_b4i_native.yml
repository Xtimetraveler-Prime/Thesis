permissions:
  contents: read
jobs:
  native-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Synthetic-only no-board safety gates
        working-directory: Loihi_Digital_Twin/v3
        run: PYTHONPATH="$PWD/src" python -m pytest -q -rs tests/test_p07_b4i_physical_pilot.py tests/test_p07_b4j_shell_program_pilot.py tests/test_p07_b4k_standalone_admission.py tests/test_p07_b4l1_stage_frozen_27core.py tests/test_p07_b4l_physical_model_deploy.py tests/test_p07_b4l_page_probe.py tests/test_p07_b4l_physical_paging.py tests/test_p07_b4l_b3_epoch.py
