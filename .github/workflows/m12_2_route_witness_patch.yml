name: Add M12.2 route target physical witnesses

on:
  push:
    branches:
      - agent/m12-2-single-tick-physical
    paths:
      - .github/workflows/m12_2_route_witness_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-2-single-tick-physical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch passive route-target witnesses
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          route = 'Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv'
          repl(route,
              '    output logic [7:0]   active_source,\n    output logic [31:0]  active_route_index,\n\n    // Static route-image and spike preload writes. Accepted only while idle.\n',
              '    output logic [7:0]   active_source,\n    output logic [31:0]  active_route_index,\n\n    // Passive route-target witnesses for physical M12.2 localization. These\n    // registers never feed routing decisions or architectural state.\n    output logic         route_target_write_seen,\n    output logic [11:0]  last_route_target_write_addr,\n    output logic [15:0]  last_route_target_write_data,\n    output logic [11:0]  last_route_target_read_addr,\n    output logic [15:0]  last_route_target_read_data,\n\n    // Static route-image and spike preload writes. Accepted only while idle.\n')
          repl(route,
              '            work_target            <= 16\'d0;\n            next_count             <= 13\'d0;\n            debug_rvalid           <= 1\'b0;\n',
              '            work_target                  <= 16\'d0;\n            next_count                   <= 13\'d0;\n            debug_rvalid                 <= 1\'b0;\n            route_target_write_seen      <= 1\'b0;\n            last_route_target_write_addr <= 12\'d0;\n            last_route_target_write_data <= 16\'d0;\n            last_route_target_read_addr  <= 12\'d0;\n            last_route_target_read_data  <= 16\'d0;\n')
          repl(route,
              '                if (route_target_we)\n                    route_target_mem[route_target_addr] <= route_target_wdata;\n',
              '                if (route_target_we) begin\n                    route_target_mem[route_target_addr] <= route_target_wdata;\n                    route_target_write_seen      <= 1\'b1;\n                    last_route_target_write_addr <= route_target_addr;\n                    last_route_target_write_data <= route_target_wdata;\n                end\n')
          repl(route,
              '                S_ROUTE_READ: begin\n                    work_target <= route_target_mem[active_route_index[11:0]];\n                    state       <= S_ROUTE_APPEND;\n                end\n',
              '                S_ROUTE_READ: begin\n                    work_target                 <= route_target_mem[active_route_index[11:0]];\n                    last_route_target_read_addr <= active_route_index[11:0];\n                    last_route_target_read_data <= route_target_mem[active_route_index[11:0]];\n                    state                       <= S_ROUTE_APPEND;\n                end\n')

          outer = 'Neuromorphic Digital Twin/rtl/core_v1/recurrent_integrated_core_controller_v1.sv'
          repl(outer,
              '    output logic [12:0]  last_routed_count,\n    output logic [12:0]  trace_external_event_count,\n\n    // Neuron and frozen M08 preload paths.\n',
              '    output logic [12:0]  last_routed_count,\n    output logic [12:0]  trace_external_event_count,\n    output logic         route_target_write_seen,\n    output logic [11:0]  last_route_target_write_addr,\n    output logic [15:0]  last_route_target_write_data,\n    output logic [11:0]  last_route_target_read_addr,\n    output logic [15:0]  last_route_target_read_data,\n\n    // Neuron and frozen M08 preload paths.\n')
          repl(outer,
              '        .last_consumed_count(last_consumed_recurrent_count), .last_routed_count(last_routed_count),\n        .active_source(), .active_route_index(),\n',
              '        .last_consumed_count(last_consumed_recurrent_count), .last_routed_count(last_routed_count),\n        .active_source(), .active_route_index(),\n        .route_target_write_seen(route_target_write_seen),\n        .last_route_target_write_addr(last_route_target_write_addr),\n        .last_route_target_write_data(last_route_target_write_data),\n        .last_route_target_read_addr(last_route_target_read_addr),\n        .last_route_target_read_data(last_route_target_read_data),\n')

          cap = 'Neuromorphic Digital Twin/rtl/core_v1/m12_2_single_tick_capture_controller_v1.sv'
          repl(cap,
              '    output logic [12:0]  observed_routed_recurrent_count,\n    output logic [12:0]  observed_external_event_count,\n\n    input  logic         trace_read_req,\n',
              '    output logic [12:0]  observed_routed_recurrent_count,\n    output logic [12:0]  observed_external_event_count,\n    output logic         observed_route_target_write_seen,\n    output logic [11:0]  observed_route_target_write_addr,\n    output logic [15:0]  observed_route_target_write_data,\n    output logic [11:0]  observed_route_target_read_addr,\n    output logic [15:0]  observed_route_target_read_data,\n\n    input  logic         trace_read_req,\n')
          repl(cap,
              '        .last_routed_count(last_routed_count),\n        .trace_external_event_count(trace_external_event_count),\n',
              '        .last_routed_count(last_routed_count),\n        .trace_external_event_count(trace_external_event_count),\n        .route_target_write_seen(observed_route_target_write_seen),\n        .last_route_target_write_addr(observed_route_target_write_addr),\n        .last_route_target_write_data(observed_route_target_write_data),\n        .last_route_target_read_addr(observed_route_target_read_addr),\n        .last_route_target_read_data(observed_route_target_read_data),\n')

          bd = 'Neuromorphic Digital Twin/rtl/core_v1/m12_2_single_tick_capture_controller_bd_v1.v'
          repl(bd,
              '    output wire [12:0]  observed_routed_recurrent_count,\n    output wire [12:0]  observed_external_event_count,\n    output wire         trace_read_ready,\n',
              '    output wire [12:0]  observed_routed_recurrent_count,\n    output wire [12:0]  observed_external_event_count,\n    output wire         observed_route_target_write_seen,\n    output wire [11:0]  observed_route_target_write_addr,\n    output wire [15:0]  observed_route_target_write_data,\n    output wire [11:0]  observed_route_target_read_addr,\n    output wire [15:0]  observed_route_target_read_data,\n    output wire         trace_read_ready,\n')
          repl(bd,
              '        .observed_routed_recurrent_count(observed_routed_recurrent_count),\n        .observed_external_event_count(observed_external_event_count),\n        .trace_read_req(trace_read_req), .trace_read_space(trace_read_space),\n',
              '        .observed_routed_recurrent_count(observed_routed_recurrent_count),\n        .observed_external_event_count(observed_external_event_count),\n        .observed_route_target_write_seen(observed_route_target_write_seen),\n        .observed_route_target_write_addr(observed_route_target_write_addr),\n        .observed_route_target_write_data(observed_route_target_write_data),\n        .observed_route_target_read_addr(observed_route_target_read_addr),\n        .observed_route_target_read_data(observed_route_target_read_data),\n        .trace_read_req(trace_read_req), .trace_read_space(trace_read_space),\n')

          project = 'Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_2_project.tcl'
          repl(project,
              '    CONFIG.C_NUM_PROBE_IN {26} \\\n    CONFIG.C_NUM_PROBE_OUT {6} \\\n',
              '    CONFIG.C_NUM_PROBE_IN {31} \\\n    CONFIG.C_NUM_PROBE_OUT {6} \\\n')
          repl(project,
              '    CONFIG.C_PROBE_IN25_WIDTH {1} \\\n    CONFIG.C_PROBE_OUT0_WIDTH {1} CONFIG.C_PROBE_OUT0_INIT_VAL {0x0} \\\n',
              '    CONFIG.C_PROBE_IN25_WIDTH {1} \\\n    CONFIG.C_PROBE_IN26_WIDTH {1} \\\n    CONFIG.C_PROBE_IN27_WIDTH {12} \\\n    CONFIG.C_PROBE_IN28_WIDTH {16} \\\n    CONFIG.C_PROBE_IN29_WIDTH {12} \\\n    CONFIG.C_PROBE_IN30_WIDTH {16} \\\n    CONFIG.C_PROBE_OUT0_WIDTH {1} CONFIG.C_PROBE_OUT0_INIT_VAL {0x0} \\\n')
          repl(project,
              'connect_named_pair trace_response_error               capture_0/trace_response_error vio_m12_2/probe_in25\n\nconnect_named_pair capture_start',
              'connect_named_pair trace_response_error               capture_0/trace_response_error vio_m12_2/probe_in25\nconnect_named_pair observed_route_target_write_seen    capture_0/observed_route_target_write_seen vio_m12_2/probe_in26\nconnect_named_pair observed_route_target_write_addr    capture_0/observed_route_target_write_addr vio_m12_2/probe_in27\nconnect_named_pair observed_route_target_write_data    capture_0/observed_route_target_write_data vio_m12_2/probe_in28\nconnect_named_pair observed_route_target_read_addr     capture_0/observed_route_target_read_addr vio_m12_2/probe_in29\nconnect_named_pair observed_route_target_read_data     capture_0/observed_route_target_read_data vio_m12_2/probe_in30\n\nconnect_named_pair capture_start')

          tcl = 'Neuromorphic Digital Twin/rtl/core_v1/vivado/capture_m12_2_single_tick.tcl'
          repl(tcl,
              'set p_rsp_error [find_one_probe $vio trace_response_error]\n\nset p_start [find_one_probe $vio capture_start]\n',
              'set p_rsp_error [find_one_probe $vio trace_response_error]\nset p_route_write_seen [find_one_probe $vio observed_route_target_write_seen]\nset p_route_write_addr [find_one_probe $vio observed_route_target_write_addr]\nset p_route_write_data [find_one_probe $vio observed_route_target_write_data]\nset p_route_read_addr [find_one_probe $vio observed_route_target_read_addr]\nset p_route_read_data [find_one_probe $vio observed_route_target_read_data]\n\nset p_start [find_one_probe $vio capture_start]\n')
          repl(tcl,
              '    set external_count [probe_uint $p_external_count]\n\n    set state_before {}\n',
              '    set external_count [probe_uint $p_external_count]\n    set route_write_seen [probe_uint $p_route_write_seen]\n    set route_write_addr [probe_uint $p_route_write_addr]\n    set route_write_data [probe_uint $p_route_write_data]\n    set route_read_addr [probe_uint $p_route_read_addr]\n    set route_read_data [probe_uint $p_route_read_data]\n    puts "M12.2 route-target witness case $case_id: write_seen=$route_write_seen write_addr=$route_write_addr write_data=$route_write_data read_addr=$route_read_addr read_data=$route_read_data"\n\n    set state_before {}\n')

          test = 'Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py'
          p = Path(test)
          txt = p.read_text()
          txt = txt.replace('    assert "CONFIG.C_NUM_PROBE_IN {26}" in project\n', '    assert "CONFIG.C_NUM_PROBE_IN {31}" in project\n', 1)
          txt += '''\n\ndef test_route_target_physical_witnesses_are_passive_and_vio_visible() -> None:\n    route = (RTL / "recurrent_route_queue_v1.sv").read_text(encoding="utf-8")\n    outer = (RTL / "recurrent_integrated_core_controller_v1.sv").read_text(encoding="utf-8")\n    controller = CONTROLLER.read_text(encoding="utf-8")\n    wrapper = WRAPPER.read_text(encoding="utf-8")\n    project = PROJECT_TCL.read_text(encoding="utf-8")\n    capture = CAPTURE_TCL.read_text(encoding="utf-8")\n\n    for signal in (\n        "route_target_write_seen",\n        "last_route_target_write_addr",\n        "last_route_target_write_data",\n        "last_route_target_read_addr",\n        "last_route_target_read_data",\n    ):\n        assert signal in route\n        assert signal in outer\n\n    assert "route_target_write_seen      <= 1'b1;" in route\n    assert "last_route_target_write_data <= route_target_wdata;" in route\n    assert "last_route_target_read_data <= route_target_mem[active_route_index[11:0]];" in route\n    assert "never feed routing decisions or architectural state" in route\n\n    for signal in (\n        "observed_route_target_write_seen",\n        "observed_route_target_write_addr",\n        "observed_route_target_write_data",\n        "observed_route_target_read_addr",\n        "observed_route_target_read_data",\n    ):\n        assert signal in controller\n        assert signal in wrapper\n        assert signal in project\n        assert signal in capture\n\n    assert "CONFIG.C_NUM_PROBE_IN {31}" in project\n    assert "M12.2 route-target witness case $case_id:" in capture\n'''
          p.write_text(txt)
          PY
      - name: Run focused M12.2 regressions
        working-directory: Neuromorphic Digital Twin
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_m12_2_single_tick_conformance.py tests/test_m12_2_capture_sources.py
      - name: Commit witness instrumentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv' \
            'Neuromorphic Digital Twin/rtl/core_v1/recurrent_integrated_core_controller_v1.sv' \
            'Neuromorphic Digital Twin/rtl/core_v1/m12_2_single_tick_capture_controller_v1.sv' \
            'Neuromorphic Digital Twin/rtl/core_v1/m12_2_single_tick_capture_controller_bd_v1.v' \
            'Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_2_project.tcl' \
            'Neuromorphic Digital Twin/rtl/core_v1/vivado/capture_m12_2_single_tick.tcl' \
            'Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py'
          git commit -m 'Instrument M12.2 route target physical path'
          git push origin HEAD:agent/m12-2-single-tick-physical
