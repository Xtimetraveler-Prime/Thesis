name: Derive M12.3 build shell

on:
  push:
    branches:
      - agent/m12-3-multitick-recurrent-physical
    paths:
      - .github/workflows/m12_3_derive_build_shell.yml

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-3-multitick-recurrent-physical
      - run: python scripts/derive_m12_3_build_shell.py
      - name: Verify derived build-shell identities
        run: |
          grep -F 'm12_3_multitick_capture_controller_v1 capture_i' 'Neuromorphic Digital Twin/rtl/core_v1/m12_3_multitick_capture_controller_bd_v1.v'
          grep -F 'set project_name "neuromorphic_twin_m12_3"' 'Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_3_project.tcl'
          grep -F 'CONFIG.C_NUM_PROBE_IN {35}' 'Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_3_project.tcl'
          grep -F 'generate_m12_3_multitick_corpus.py' 'Neuromorphic Digital Twin/rtl/core_v1/run_m12_3_bitstream.sh'
          grep -F 'M12.3 directed committed ticks: 40' 'Neuromorphic Digital Twin/rtl/core_v1/run_m12_3_bitstream.sh'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'Neuromorphic Digital Twin/rtl/core_v1/m12_3_multitick_capture_controller_bd_v1.v' \
            'Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_3_project.tcl' \
            'Neuromorphic Digital Twin/rtl/core_v1/run_m12_3_bitstream.sh'
          git commit -m 'Add M12.3 reproducible Vivado build shell'
          git push origin HEAD:agent/m12-3-multitick-recurrent-physical
