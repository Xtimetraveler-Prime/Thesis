name: M13.4 full differential gate once
on:
  push:
    branches: [agent/m13-4-directed-differential-probes]
    paths: ['.github/workflows/m13_4_full_gate_once.yml']
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-4-directed-differential-probes
          fetch-depth: 0
      - name: Install project and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          cd 'Neuromorphic Digital Twin'
          python3 -m pip install -e '.[dev,compare]'
      - name: Fetch pinned Catalyst and install SDK
        run: |
          cd 'Neuromorphic Digital Twin'
          bash scripts/fetch_m13_1_catalyst.sh
          python3 -m pip install -e build/m13_1/catalyst-n1/sdk
      - name: Run Catalyst CUBA probes and M13.4 differential
        run: |
          cd 'Neuromorphic Digital Twin'
          bash scripts/run_m13_4_catalyst_cuba_probes.sh
          python3 examples/run_m13_4_differential.py \
            --output build/m13_4/differential \
            --catalyst-cuba-log build/m13_4/catalyst-rtl/native.log
          cat build/m13_4/differential/directed-report.json
      - name: Run focused M13 tests
        run: |
          cd 'Neuromorphic Digital Twin'
          python3 -m pytest -q tests/test_m13_3_normalization.py tests/test_m13_4_directed_probes.py
      - name: Run full thesis regression
        run: |
          cd 'Neuromorphic Digital Twin'
          python3 -m pytest -q
      - name: Shell syntax checks
        run: |
          cd 'Neuromorphic Digital Twin'
          bash -n scripts/run_m13_4_catalyst_cuba_probes.sh
      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13_4_full_gate_once.yml
          git commit -m 'Remove temporary M13.4 full gate workflow'
          git push origin HEAD:agent/m13-4-directed-differential-probes
