name: M13.5 final preflight once
on:
  push:
    branches: [agent/m13-5-catalyst-k26-reproduction]
    paths: [.github/workflows/m13_5_final_preflight_once.yml]
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-5-catalyst-k26-reproduction
          fetch-depth: 0
      - name: Install project and Icarus
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          cd 'Neuromorphic Digital Twin'
          python3 -m pip install -e '.[dev,compare]'
          bash scripts/fetch_m13_1_catalyst.sh
      - name: Validate exact Catalyst K26 hardware boundary
        shell: bash
        run: |
          cd 'Neuromorphic Digital Twin'
          PYTHONPATH=src python3 examples/validate_m13_5_hardware_manifest.py --catalyst-checkout build/m13_1/catalyst-n1
          bash scripts/run_m13_5_catalyst_kria_elaboration.sh
          bash -n scripts/run_m13_5_catalyst_k26_vivado.sh
          bash -n scripts/run_m13_5_catalyst_kria_elaboration.sh
      - name: Focused M13.5 tests
        shell: bash
        run: |
          cd 'Neuromorphic Digital Twin'
          python3 -m pytest --override-ini addopts='' -q tests/test_m13_5_hardware_audit.py tests/test_m13_5_hardware_comparison.py | tee /tmp/m13_5_focused.log
      - name: Complete project regression
        shell: bash
        run: |
          cd 'Neuromorphic Digital Twin'
          python3 -m pytest --override-ini addopts='' -q | tee /tmp/m13_5_full.log
      - name: Verify fairness and baseline guards
        shell: bash
        run: |
          cd 'Neuromorphic Digital Twin'
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('references/m13_5_hardware_manifest.json').read_text())
          rules = '\n'.join(m['fairness_rules'])
          assert 'Do not compare M12 latency/throughput' in rules
          assert 'Do not compare power' in rules
          assert m['catalyst_k26']['physical_programming_boundary']['source_supported'] is False
          assert m['catalyst_k26']['upstream_target_part'] == 'xczu5ev-sfvc784-2-i'
          assert m['project_m12_physical']['target_part'] == 'xck26-sfvc784-2LV-c'
          PY
          cd ..
          git diff --name-only origin/main...HEAD > /tmp/m13_5_names.txt
          cat /tmp/m13_5_names.txt
          if grep -E '^Neuromorphic Digital Twin/(hls/core_v1|rtl/core_v1|src/neuromorphic_twin/(model|arithmetic|core|routing|weights)\.py)' /tmp/m13_5_names.txt; then
            echo 'ERROR: M13.5 unexpectedly changed a computational baseline path.' >&2
            exit 1
          fi
      - name: Record preflight checkpoint and remove workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def count(path):
              text = Path(path).read_text()
              matches = re.findall(r'(\d+) passed', text)
              if not matches:
                  raise SystemExit(f'could not parse pytest pass count from {path}')
              return int(matches[-1])

          focused = count('/tmp/m13_5_focused.log')
          full = count('/tmp/m13_5_full.log')

          milestones = Path('MILESTONES.md')
          m = milestones.read_text()
          old = '''### M13.5 — Reproduce Catalyst at the strongest common FPGA/RTL boundary\n\n**Status:** Planned\n\n#### Core goal\n'''
          new = '''### M13.5 — Reproduce Catalyst at the strongest common FPGA/RTL boundary\n\n**Status:** In progress\n**Started:** 2026-09-10\n**Repository evidence:** branch `agent/m13-5-catalyst-k26-reproduction`; M13.5.1 automated preflight complete, M13.5.2 awaiting independent Vivado 2025.2 reproduction\n\n#### Core goal\n'''
          if old not in m:
              raise SystemExit('M13.5 milestone start anchor not found')
          m = m.replace(old, new, 1)
          anchor = '#### Preferred physical comparison\n'
          insertion = f'''#### Development decomposition\n\nM13.5 is being executed in three ordered sub-boundaries:\n\n- **M13.5.1 — Freeze hardware comparison boundary and automated RTL preflight.** Pin the source-supported Catalyst K26 configuration, tooling assumptions, fairness rules, physical-programming limitation, wrapper elaboration, and vendor-report parser before observing Vivado results.\n- **M13.5.2 — Reproduce Catalyst synthesis/place/route in Vivado 2025.2.** Run the pinned `synth_only` and `run_impl.tcl` flow without editing Catalyst source; preserve the implemented DCP and native reports.\n- **M13.5.3 — Normalize hardware evidence and close at the strongest defensible boundary.** Compare routed timing/resources with M12.5 only where definitions are compatible, explicitly withhold unsupported latency/power/physical claims, and decide whether routed implementation is the final source-supported boundary.\n\n#### M13.5.1 completion evidence\n\nThe hardware comparison contract is frozen in `Neuromorphic Digital Twin/references/m13_5_hardware_manifest.json` before any Catalyst Vivado utilization result is observed. It records the exact Catalyst pin, upstream K26 target part `xczu5ev-sfvc784-2-i`, 2-core x 256-neuron wrapper, 4096-entry pool/core, 100 MHz target, Vivado-2025.2 thesis reproduction choice, project M12.5 baseline, target-part distinction, and fairness rules. It also records an upstream tooling caveat: the README's default `build_kria.tcl` invocation does not launch synthesis at the pinned source, while the Tcl's existing documented `synth_only` mode does. The reproduction runner therefore selects that existing mode and then executes the pinned `run_impl.tcl` without modifying Catalyst source.\n\nThe exact pinned `fpga/kria/` directory contains only four source/build files and provides no K26 XDC, processing-system block design, or `write_bitstream` step. M13.5 consequently treats routed implementation as the strongest directly supplied hardware boundary unless a separately identified board integration is later justified. This is a platform/tooling limitation, not a behavioral discrepancy.\n\nAutomated current-head preflight verified the exact Catalyst checkout and K26 inventory, elaborated the same 15 RTL files named by the pinned K26 synthesis Tcl under Icarus Verilog 12+, passed **{focused}/{focused} focused M13.5 tests**, passed the complete **{full}/{full} project regression suite**, validated both vendor shell scripts syntactically, and confirmed that no frozen computational-core/HLS/FPGA-v1 path changed. Earlier M13.1 evidence already established the pinned Catalyst native RTL regression at 25/25; M13.5 does not alter that external source.\n\nThe source-controlled Vivado runner now preserves native synthesis/implementation reports and the implemented DCP, parses routed WNS/WHS and resource counts into machine-readable JSON, generates a fairness-preserving project/Catalyst comparison artifact, hashes the evidence tree, rejects negative routed setup/hold slack, and structurally withholds latency/throughput, power/energy, and physical-Catalyst claims that are not supported by the supplied flow.\n\n**M13.5.1 is complete. M13.5.2 is the current boundary and requires independent execution with the local Vivado 2025.2 installation.**\n\n'''
          if anchor not in m:
              raise SystemExit('M13.5 preferred comparison anchor not found')
          m = m.replace(anchor, insertion + anchor, 1)
          milestones.write_text(m)

          doc = Path('Neuromorphic Digital Twin/docs/M13_5_CATALYST_K26_REPRODUCTION.md')
          d = doc.read_text()
          d = d.replace(
              '**In progress — hardware-comparison boundary frozen and automated RTL/vendor tooling implemented; Vivado 2025.2 routed reproduction remains to be run independently.**',
              '**In progress — M13.5.1 automated hardware/RTL preflight complete; M13.5.2 Vivado 2025.2 routed reproduction remains to be run independently.**'
          )
          d = d.replace(
              '  catalyst-hardware-result.json\n  evidence-manifest.json\n  native_reports/',
              '  catalyst-hardware-result.json\n  hardware-comparison.json\n  hardware-comparison.md\n  evidence-manifest.json\n  native_reports/'
          )
          checkpoint = f'''\n## Automated M13.5.1 preflight evidence\n\nA clean Ubuntu 24.04 current-head reconstruction completed the non-Vivado M13.5 boundary successfully. The run verified the exact pinned Catalyst checkout and `fpga/kria` inventory, elaborated the K26 wrapper from the same 15 RTL files named by `build_kria.tcl` with Icarus Verilog 12+, passed **{focused}/{focused} focused M13.5 tests**, and passed the complete **{full}/{full} thesis regression suite**. Both M13.5 shell runners passed syntax validation and the branch-diff guard confirmed no frozen computational-core, HLS, routing, weight, or FPGA-v1 behavior file changed.\n\nM13.1 already established the unchanged Catalyst pin at **25/25 native RTL regression testbenches**; the M13.5 branch consumes that exact source and adds the K26-wrapper-specific elaboration gate rather than redefining Catalyst's regression suite.\n\nAt this checkpoint all work that does not require AMD Vivado is complete. The next evidence-producing command is the source-controlled Vivado 2025.2 runner. Its output will determine the actual routed timing/resource result and therefore cannot be pre-filled or inferred from upstream claims.\n'''
          if '## Automated M13.5.1 preflight evidence' not in d:
              d += checkpoint
          doc.write_text(d)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13_5_final_preflight_once.yml
          git add MILESTONES.md 'Neuromorphic Digital Twin/docs/M13_5_CATALYST_K26_REPRODUCTION.md'
          git commit -m 'Complete M13.5.1 hardware preflight'
          git push origin HEAD:agent/m13-5-catalyst-k26-reproduction
