name: Update M12.1 milestone tracker

on:
  push:
    branches:
      - agent/m12-1-closure
    paths:
      - .github/workflows/m12_1_milestones_patch.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-1-closure
          fetch-depth: 0
      - name: Update M12.1 progress
        run: python3 scripts/update_m12_1_milestones.py
      - name: Validate tracker markers
        shell: bash
        run: |
          grep -Fq '#### M12.1.1 — Freeze the physical trace artifact and host parser' MILESTONES.md
          grep -Fq '#### M12.1.3 — Wire physical host-stepped capture through Vivado VIO' MILESTONES.md
          grep -Fq '**Repository evidence:** PR #8' MILESTONES.md
          grep -Fq '#### M12.1.4 — Prove repeated physical capture reproducibility and close M12.1' MILESTONES.md
          grep -Fq '**Status:** In progress' MILESTONES.md
          grep -Fq '### M12.2 — Exact single-tick Python-versus-FPGA differential validation' MILESTONES.md
      - name: Commit tracker update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md
          git commit -m "Update M12.1 physical trace milestone progress"
          git push origin HEAD:agent/m12-1-closure
