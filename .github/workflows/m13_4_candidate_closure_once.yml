name: M13.4 candidate closure once
on:
  push:
    branches: [agent/m13-4-directed-differential-probes]
    paths: ['.github/workflows/m13_4_candidate_closure_once.yml']
permissions:
  contents: write
jobs:
  close-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-4-directed-differential-probes
          fetch-depth: 0
      - name: Advance probe catalog and milestone to candidate validation boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('Neuromorphic Digital Twin')
          catalog_path = root / 'references/m13_4_probe_catalog.json'
          data = json.loads(catalog_path.read_text())
          data['purpose'] = (
              'Preserve the M13.4 directed architectural questions frozen before normalization '
              'and record which native execution boundary is authorized now that M13.3 is frozen. '
              'Observed discrepancy outcomes remain in m13_4_candidate_findings.json rather than this planning catalog.'
          )
          gate = data['normalization_gate']
          gate['state'] = 'm13_3_frozen'
          gate['normalized_comparison_allowed'] = True
          gate['rule'] = (
              'M13.3 normalization is frozen. M13.4 may execute only the predeclared transforms and '
              'comparison categories from that specification; qualitative/non-comparable fields must not be coerced into exact equality.'
          )
          catalyst_states = {
              'P01-current-impulse-decay': 'runnable_new_native',
              'P02-voltage-decay': 'runnable_new_native',
              'P03-negative-rounding': 'runnable_new_native',
              'P04-threshold-boundary': 'runnable_new_native',
              'P05-refractory-release': 'runnable_new_native',
              'P06-signed-synaptic-drive': 'runnable_new_native',
              'P07-weight-encoding-boundaries': 'runnable_new_native',
              'P08-fanin-fanout': 'runnable_new_native',
              'P09-event-multiplicity': 'not_applicable',
              'P10-recurrent-timing': 'runnable_new_native',
              'P11-state-saturation': 'not_applicable',
              'P12-simultaneous-spikes': 'runnable_new_native',
          }
          for probe in data['probes']:
              probe['participation']['catalyst_n1'] = catalyst_states[probe['id']]
              if probe['id'] in {'P09-event-multiplicity', 'P11-state-saturation'}:
                  probe['participation']['brian2loihi'] = 'not_applicable'
              elif probe['id'] == 'P10-recurrent-timing':
                  probe['participation']['brian2loihi'] = 'runnable_new_native'
          data['summary']['execution_authority'] = (
              'M13.3 is frozen; Catalyst CPU/RTL and dedicated Brian2Loihi recurrent probes may now run only under the declared M13.3 transforms.'
          )
          data['summary']['result_authority'] = (
              'Observed statuses and A-H classes are recorded separately in references/m13_4_candidate_findings.json.'
          )
          data['summary'].pop('not_yet_authorized', None)
          catalog_path.write_text(json.dumps(data, indent=2) + '\n')

          probes_path = root / 'src/neuromorphic_twin/comparison/m13_directed_probes.py'
          s = probes_path.read_text()
          s = s.replace(
              '"""M13.4 directed architectural probe planning and pre-normalization evidence.\n\nM13.4 is intentionally split into two boundaries:\n\n* native/pre-normalization evidence may be produced from already validated shared\n  project/Brian2Loihi scenarios; and\n* normalized cross-implementation comparison is forbidden until M13.3 freezes\n  the common behavioral subset and parameter/state transforms.\n\nThis prevents Catalyst-driven mappings from being invented after observing an\ninteresting output difference.\n"""',
              '"""M13.4 directed architectural probe planning and reusable evidence.\n\nThe probe questions were frozen before M13.3 normalization. M13.4 now permits\nnormalized execution only when the M13.3 specification is explicitly frozen;\nobserved findings remain separate from this planning catalog.\n"""'
          )
          s = s.replace(
              '    if gate.get("state") != "blocked_m13_3_not_frozen":\n        raise ValueError("M13.4 catalog must remain blocked until M13.3 is frozen")\n    if gate.get("normalized_comparison_allowed") is not False:\n        raise ValueError("normalized comparison cannot be enabled by M13.4 itself")',
              '    if gate.get("state") != "m13_3_frozen":\n        raise ValueError("M13.4 catalog must record the frozen M13.3 gate")\n    if gate.get("normalized_comparison_allowed") is not True:\n        raise ValueError("normalized comparison must be enabled only after M13.3 is frozen")'
          )
          probes_path.write_text(s)

          tests_path = root / 'tests/test_m13_4_directed_probes.py'
          t = tests_path.read_text()
          old = '''def test_m13_4_keeps_normalized_comparison_blocked_until_m13_3() -> None:\n    data = load_probe_catalog()\n    gate = data["normalization_gate"]\n    assert gate["state"] == "blocked_m13_3_not_frozen"\n    assert gate["normalized_comparison_allowed"] is False\n    assert gate["required_schema"] == M13_3_EXPECTED_SCHEMA\n    assert all(probe["participation"]["catalyst_n1"] == "blocked_by_m13_3" for probe in data["probes"])\n'''
          new = '''def test_m13_4_records_frozen_m13_3_execution_gate() -> None:\n    data = load_probe_catalog()\n    gate = data["normalization_gate"]\n    assert gate["state"] == "m13_3_frozen"\n    assert gate["normalized_comparison_allowed"] is True\n    assert gate["required_schema"] == M13_3_EXPECTED_SCHEMA\n    states = {probe["id"]: probe["participation"]["catalyst_n1"] for probe in data["probes"]}\n    assert states["P01-current-impulse-decay"] == "runnable_new_native"\n    assert states["P08-fanin-fanout"] == "runnable_new_native"\n    assert states["P10-recurrent-timing"] == "runnable_new_native"\n    assert states["P09-event-multiplicity"] == "not_applicable"\n    assert states["P11-state-saturation"] == "not_applicable"\n'''
          if old not in t:
              raise SystemExit('old M13.4 blocked-gate test not found')
          tests_path.write_text(t.replace(old, new, 1))

          milestones = Path('MILESTONES.md')
          m = milestones.read_text()
          old = '**Repository evidence:** branch `agent/m13-4-directed-differential-probes`; pre-normalization scaffold only while M13.3 remains Planned'
          new = '**Repository evidence:** branch `agent/m13-4-directed-differential-probes`; frozen M13.3-normalized 12-probe candidate evidence awaiting independent local validation'
          if old not in m:
              raise SystemExit('M13.4 repository-evidence anchor not found')
          m = m.replace(old, new, 1)
          anchor = '''#### Pass boundary\n\nThe agreed directed corpus has been executed across every applicable implementation, with all agreements and discrepancies reproduced and classified. M13 does not require all implementations to produce identical results; it requires every meaningful difference to be understood well enough to state whether it reflects mapping, scope, architecture, ambiguity, or a defect.\n'''
          insertion = '''#### Candidate completion evidence\n\nThe M13.3-normalized directed engine now executes all **12 frozen probe questions** against every applicable pinned implementation boundary and preserves native artifacts before normalization. The corrected clean reconstruction produced **6 agreements, 3 architectural/model differences, 1 partial-scope result, and 2 deliberately non-comparable results, with zero Class-A or Class-B candidates**. The meaningful differences are: Catalyst RTL negative-decay rounding (Class C), Catalyst CPU negative sub-rest membrane behavior (Class C), and Brian2Loihi neuron-to-neuron recurrence under its native LoihiNetwork schedule (Class D). The weight-source-format boundary is partial scope (Classes C/G); repeated-identical-source event multiplicity and cross-implementation finite-width overflow remain non-comparable by the frozen M13.3 contract.\n\nTwo Class-H harness defects were found and removed before freezing candidate findings: Catalyst CUBA state SRAM was initially reused across positive/negative probes, and Catalyst compiler physical GIDs were initially read as logical neuron IDs. The final harness uses independent CUBA neuron state slots and explicitly records/remaps `logical_to_catalyst_gid`; after the latter correction the apparent fan-in discrepancy disappeared and P08 agrees.\n\nThe candidate result authority is `Neuromorphic Digital Twin/references/m13_4_candidate_findings.json`; the methods/results narrative is `Neuromorphic Digital Twin/docs/M13_4_DIRECTED_DIFFERENTIAL.md`. No project computational-core, HLS, or FPGA-v1 behavior changed, and no M12 physical revalidation is required because no A/B candidate was found. M13.4 remains In progress until these results are independently reproduced from the development branch.\n\n'''
          if anchor not in m:
              raise SystemExit('M13.4 pass-boundary anchor not found')
          m = m.replace(anchor, insertion + anchor, 1)
          milestones.write_text(m)
          PY
      - name: Install project and external comparison tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          cd 'Neuromorphic Digital Twin'
          python3 -m pip install -e '.[dev,compare]'
          bash scripts/fetch_m13_1_catalyst.sh
          python3 -m pip install -e build/m13_1/catalyst-n1/sdk
      - name: Reproduce M13.4 candidate findings
        run: |
          cd 'Neuromorphic Digital Twin'
          PYTHONPATH=src python3 examples/run_m13_4_directed_probes.py --require-normalization
          bash scripts/run_m13_4_catalyst_cuba_probes.sh
          python3 examples/run_m13_4_differential.py \
            --output build/m13_4/differential \
            --catalyst-cuba-log build/m13_4/catalyst-rtl/native.log
          python3 examples/validate_m13_4_candidate_findings.py \
            --report build/m13_4/differential/directed-report.json
      - name: Run focused and full regression
        run: |
          cd 'Neuromorphic Digital Twin'
          python3 -m pytest -q \
            tests/test_m13_3_normalization.py \
            tests/test_m13_4_directed_probes.py \
            tests/test_m13_4_differential.py
          python3 -m pytest -q
          bash -n scripts/run_m13_4_catalyst_cuba_probes.sh
      - name: Verify audit did not modify computational baseline files
        run: |
          git diff --name-only origin/main...HEAD > /tmp/m13_4_names.txt
          cat /tmp/m13_4_names.txt
          if grep -E '^Neuromorphic Digital Twin/(hls/core_v1|rtl/core_v1|src/neuromorphic_twin/(model|arithmetic|core|routing|weights)\.py)' /tmp/m13_4_names.txt; then
            echo 'ERROR: M13.4 unexpectedly changed a computational baseline path.' >&2
            exit 1
          fi
      - name: Commit candidate closure and remove workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13_4_candidate_closure_once.yml
          git add MILESTONES.md \
            'Neuromorphic Digital Twin/references/m13_4_probe_catalog.json' \
            'Neuromorphic Digital Twin/src/neuromorphic_twin/comparison/m13_directed_probes.py' \
            'Neuromorphic Digital Twin/tests/test_m13_4_directed_probes.py'
          git commit -m 'Advance M13.4 to independent validation boundary'
          git push origin HEAD:agent/m13-4-directed-differential-probes
