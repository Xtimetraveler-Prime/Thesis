name: Patch M11.6 PS automation

on:
  push:
    branches:
      - agent/m11-6-bitstream-hardware-smoke
    paths:
      - .github/workflows/patch_m11_6_ps_automation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-6-bitstream-hardware-smoke
          fetch-depth: 0
      - name: Apply targeted M11.6 PS automation fix
        run: python3 scripts/patch_m11_6_ps_automation.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m11_6_project.tcl" \
                  "Neuromorphic Digital Twin/tests/test_m11_6_bitstream_sources.py"
          git commit -m "Initialize K26 PS through board automation in M11.6"
          git push origin HEAD:agent/m11-6-bitstream-hardware-smoke
