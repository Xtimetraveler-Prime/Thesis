name: P08-B4.2 full1024 physical runner/offline numerical negative tests NO BOARD
on:
  push:
    branches:
      - agent/v3-p08-b4-fullscale
    paths:
      - "Loihi_Digital_Twin/v3/scripts/p08_b4_2_physical_run.py"
      - "Loihi_Digital_Twin/v3/scripts/p08_b4_2_verify_full1024.py"
      - "Loihi_Digital_Twin/v3/vivado/p08_b4_2_full1024_run_and_capture.tcl"
      - "Loihi_Digital_Twin/v3/tests/test_p08_b4_2_full1024_physical.py"
      - ".github/workflows/p08_b4_2_full1024_physical_offline.yml"
  pull_request:
    paths:
      - "Loihi_Digital_Twin/v3/scripts/p08_b4_2_physical_run.py"
      - "Loihi_Digital_Twin/v3/scripts/p08_b4_2_verify_full1024.py"
      - "Loihi_Digital_Twin/v3/vivado/p08_b4_2_full1024_run_and_capture.tcl"
      - "Loihi_Digital_Twin/v3/tests/test_p08_b4_2_full1024_physical.py"
      - ".github/workflows/p08_b4_2_full1024_physical_offline.yml"
permissions:
  contents: read
jobs:
  native-full1024-physical-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: Loihi_Digital_Twin/v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install no board dependencies
        run: python3 -m pip install -q pytest
      - name: Syntax all new full1024 scripts
        run: |
          python3 -m compileall -q             scripts/p08_b4_2_physical_run.py             scripts/p08_b4_2_verify_full1024.py             tests/test_p08_b4_2_full1024_physical.py
      - name: Full 1024 numerical/clock/CRC/Tcl mailbox and denied physical tests
        run: |
          python3 -m pytest -q -rs             tests/test_p08_b4_2_full1024_physical.py             tests/test_p08_b4_1_scalar_1024.py             tests/test_p08_b3_pilot16_physical.py
      - name: Explicit no board classification
        run: |
          echo "P08_B4_2_FULL1024_OFFLINE_NUMERICAL_AND_JTAG_SOURCE_NEGATIVE_CI=PASS"
          echo "P08_B4_2_FULL1024_SCALAR_REAL_SHARDS_OPERATOR_ADMISSION=PENDING"
          echo "P08_B4_2_FULL1024_KV260_PHYSICAL_JTAG=NOT_RUN"
          echo "P08_B4_2_DESTRUCTIVE_APPROVAL_IN_CI=NO"
          echo "P08_B4_2_OFFICIAL_MNIST_TEST=SEALED"
