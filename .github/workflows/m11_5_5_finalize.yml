name: Finalize M11.5.5 milestones

on:
  push:
    branches:
      - agent/m11-5-5-system-validation
    paths:
      - .github/workflows/m11_5_5_finalize.yml

permissions:
  contents: write

jobs:
  update_milestones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-5-5-system-validation
          fetch-depth: 0
      - name: Patch milestone tracker
        run: python3 scripts/finalize_m11_5_5_milestones.py
      - name: Commit milestone closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md
          git commit -m "Complete M11.5 system integration milestone"
          git push origin HEAD:agent/m11-5-5-system-validation
