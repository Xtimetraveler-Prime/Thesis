name: M13.2 one-shot renderer closure fix

on:
  push:
    branches:
      - agent/m13-2-four-way-crosswalk
    paths:
      - '.github/workflows/m13_2_fix_renderer_once.yml'

permissions:
  contents: write

jobs:
  fix-validate-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-2-four-way-crosswalk
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair durable renderer closure wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Neuromorphic Digital Twin/src/neuromorphic_twin/m13_feature_crosswalk.py')
          text = p.read_text(encoding='utf-8')
          old_status = '**Status:** Complete crosswalk candidate; M13.2 only. No A–H discrepancy adjudication is performed here.'
          new_status = '**Status:** Complete — M13.2 pass boundary achieved on 2026-09-09. No A–H discrepancy adjudication is performed here.'
          old_pass = 'M13.2 is ready to close when this generated document and its machine-readable source agree, all 15 milestone feature classes are present, every one of the four columns is source-backed in every row, and the full project regression suite remains green. No behavioral differential result is required by M13.2 itself.'
          new_pass = '**Achieved.** The generated document and machine-readable source agree byte-for-byte under regeneration, all 15 milestone feature classes are covered by 19 rows, every one of the four columns is source-backed in every row, prior M03-M08 Brian2Loihi observations are linked where applicable, exact external source identities are verified, and the full project regression suite remains green. No behavioral differential result is required by M13.2 itself.'
          if text.count(old_status) != 1:
              raise SystemExit(f'expected exactly one stale status string, found {text.count(old_status)}')
          if text.count(old_pass) != 1:
              raise SystemExit(f'expected exactly one stale pass-boundary string, found {text.count(old_pass)}')
          text = text.replace(old_status, new_status, 1).replace(old_pass, new_pass, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install project dependencies
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pip install -e '.[dev,compare]'
      - name: Focused M13.2 validation
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pytest -q tests/test_m13_2_feature_crosswalk.py
          PYTHONPATH=src python examples/validate_m13_2_feature_crosswalk.py --write-markdown /tmp/M13_2_ARCHITECTURAL_CROSSWALK.md
          cmp /tmp/M13_2_ARCHITECTURAL_CROSSWALK.md docs/M13_2_ARCHITECTURAL_CROSSWALK.md
      - name: Complete thesis regression suite
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pytest -q
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13_2_fix_renderer_once.yml
          git add 'Neuromorphic Digital Twin/src/neuromorphic_twin/m13_feature_crosswalk.py'
          git diff --cached --check
          git commit -m 'Fix durable M13.2 crosswalk renderer closure state'
          git push origin HEAD:agent/m13-2-four-way-crosswalk
