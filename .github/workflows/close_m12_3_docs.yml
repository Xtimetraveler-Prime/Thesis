name: Close M12.3 documentation

on:
  push:
    branches:
      - agent/m12-3-multitick-recurrent-physical
    paths:
      - scripts/close_m12_3_docs.py
      - .github/workflows/close_m12_3_docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-3-multitick-recurrent-physical
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update milestone and detailed record
        run: python scripts/close_m12_3_docs.py
      - name: Commit closure documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md "Neuromorphic Digital Twin/docs/M12_3_PHYSICAL_CONFORMANCE.md"
          git diff --cached --check
          git commit -m "Close M12.3 physical recurrent conformance"
          git push origin HEAD:agent/m12-3-multitick-recurrent-physical
