name: Patch M12.2 debug-bank latch

on:
  push:
    branches:
      - agent/m12-2-single-tick-physical
    paths:
      - .github/workflows/m12_2_debug_bank_latch_patch_v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-2-single-tick-physical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch recurrent debug bank selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv')
          text = p.read_text()
          old = """    logic        bank1_mem_re;
    logic [11:0] bank1_mem_raddr;
    logic [15:0] bank1_mem_rdata;

    assign current_count = current_bank ? bank1_count : bank0_count;
    assign debug_bank0_count = bank0_count;
    assign debug_bank1_count = bank1_count;
    assign debug_rdata = debug_bank ? bank1_mem_rdata : bank0_mem_rdata;
"""
          new = """    logic        bank1_mem_re;
    logic [11:0] bank1_mem_raddr;
    logic [15:0] bank1_mem_rdata;
    logic        debug_bank_latched;

    assign current_count = current_bank ? bank1_count : bank0_count;
    assign debug_bank0_count = bank0_count;
    assign debug_bank1_count = bank1_count;
    // The recurrent banks are synchronous memories. Hold the bank selector from
    // the accepted read request until its registered RAM data is returned;
    // callers are not required to keep debug_bank stable after debug_re falls.
    assign debug_rdata = debug_bank_latched ? bank1_mem_rdata : bank0_mem_rdata;
"""
          if old not in text:
              raise SystemExit('debug mux anchor missing')
          text = text.replace(old, new, 1)
          old = """            debug_rvalid                 <= 1'b0;
            route_target_write_seen      <= 1'b0;
"""
          new = """            debug_rvalid                 <= 1'b0;
            debug_bank_latched           <= 1'b0;
            route_target_write_seen      <= 1'b0;
"""
          if old not in text:
              raise SystemExit('reset anchor missing')
          text = text.replace(old, new, 1)
          old = """                if (debug_re)
                    debug_rvalid <= 1'b1;
"""
          new = """                if (debug_re) begin
                    debug_bank_latched <= debug_bank;
                    debug_rvalid       <= 1'b1;
                end
"""
          if old not in text:
              raise SystemExit('debug request anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          t = Path('Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py')
          s = t.read_text()
          s += '''\n\ndef test_recurrent_debug_read_latches_bank_selector_for_synchronous_ram() -> None:\n    route = (RTL / "recurrent_route_queue_v1.sv").read_text(encoding="utf-8")\n    assert "logic        debug_bank_latched;" in route\n    assert "assign debug_rdata = debug_bank_latched ? bank1_mem_rdata : bank0_mem_rdata;" in route\n    assert "debug_bank_latched <= debug_bank;" in route\n    assert "callers are not required to keep debug_bank stable after debug_re falls" in route\n    assert "assign debug_rdata = debug_bank ? bank1_mem_rdata : bank0_mem_rdata;" not in route\n'''
          t.write_text(s)
          PY
      - name: Run focused Python regressions
        working-directory: Neuromorphic Digital Twin
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_m12_2_single_tick_conformance.py tests/test_m12_2_capture_sources.py
      - name: Run targeted RTL regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          mkdir -p /tmp/m12_2_latch
          iverilog -g2012 -o /tmp/m12_2_latch/simv \
            'Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv' \
            'Neuromorphic Digital Twin/rtl/core_v1/tb/tb_m12_2_recurrent_debug_bank_latch.sv'
          vvp /tmp/m12_2_latch/simv | tee /tmp/m12_2_latch/output.log
          grep -F 'M12.2 recurrent debug bank-latch regression passed' /tmp/m12_2_latch/output.log
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv' \
            'Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py'
          git commit -m 'Fix recurrent debug bank selection timing'
          git push origin HEAD:agent/m12-2-single-tick-physical
