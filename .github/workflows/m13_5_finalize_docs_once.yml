name: M13.5 final documentation once

on:
  push:
    branches:
      - agent/m13-5-catalyst-k26-reproduction
    paths:
      - '.github/workflows/m13_5_finalize_docs_once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-5-catalyst-k26-reproduction
          fetch-depth: 0

      - name: Patch final M13.5 documentation from tracked closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          closure_path = root / 'Neuromorphic Digital Twin/references/m13_5_closure.json'
          closure = json.loads(closure_path.read_text(encoding='utf-8'))
          assert closure['status'] == 'validated_complete'
          assert closure['routed_timing']['catalyst'] == {'wns_ns': 0.001, 'whs_ns': 0.013}

          resources = {row['resource']: row['catalyst'] for row in closure['resources']}
          expected = {
              'CLB LUTs': 19891.0,
              'CLB registers': 30850.0,
              'Block RAM tiles': 52.5,
              'DSPs': 14.0,
              'URAM': 0.0,
          }
          for key, value in expected.items():
              assert resources[key]['used'] == value
          evidence_hash = closure['evidence']['evidence_manifest_sha256']
          assert evidence_hash == '80a03e53f8775c6358654fa34e35176442f79b94b43de8e58ecf10920665b2bc'

          # Finalize the detailed reproduction narrative.
          path = root / 'Neuromorphic Digital Twin/docs/M13_5_CATALYST_K26_REPRODUCTION.md'
          text = path.read_text(encoding='utf-8')
          old = '**In progress — M13.5.1 preflight and M13.5.2 independent Vivado 2025.2 routed reproduction are complete; M13.5.3 tracked evidence promotion remains.**'
          new = '**Status: Complete**\n\nM13.5.1, M13.5.2, and M13.5.3 are complete. The final tracked result authority is `references/m13_5_closure.json`; bulky native Vivado products remain in the ignored local evidence tree.'
          if old not in text:
              raise SystemExit('M13.5 reproduction status marker not found')
          text = text.replace(old, new, 1)

          text = re.sub(
              r'## Current M13\.5 development boundary\n.*?(?=\n## Independent M13\.5\.2 Vivado reproduction)',
              '''## Final M13.5 hardware boundary\n\nThe independent AMD-toolchain step and tracked evidence promotion are complete. The pinned Catalyst K26-class RTL reproduced successfully through Vivado 2025.2 synthesis, placement, physical optimization, and routing at 100 MHz. M13.5 closes at **source-supported routed implementation** because the pinned `fpga/kria/` release does not supply the board constraints, PS integration, or bitstream-generation path needed to attribute a physical KV260 run to upstream Catalyst.\n\nThe accepted result is deliberately asymmetric in evidence strength: the thesis project retains physical M12.5 execution evidence, while Catalyst contributes routed implementation evidence. This is recorded as a platform/integration boundary rather than a behavioral discrepancy.\n''',
              text,
              count=1,
              flags=re.S,
          )

          stale = '''M13.5.2 is therefore complete. M13.5.3 now promotes the local preserved evidence through `scripts/run_m13_5_closure.sh`; the resulting compact `references/m13_5_closure.json` becomes the tracked authority for final resource values and evidence hashes. The closure tooling itself passed **19/19 focused tests** and **354/354 complete project tests** in clean CI before this checkpoint was recorded.'''
          final = '''M13.5.2 is therefore complete. M13.5.3 subsequently validated the preserved evidence through `scripts/run_m13_5_closure.sh`, independently re-parsed the native routed timing/utilization reports, reproduced the normalized comparison, verified the complete SHA-256 evidence manifest, and promoted `references/m13_5_closure.json` as the tracked authority. The final closure tooling passed **23/23 focused M13.5 tests** and the complete **354/354 project regression suite** before the tracked-evidence invariant tests were added.'''
          if stale in text:
              text = text.replace(stale, final, 1)

          stale_tail = '''At this checkpoint all work that does not require AMD Vivado is complete. The next evidence-producing command is the source-controlled Vivado 2025.2 runner. Its output will determine the actual routed timing/resource result and therefore cannot be pre-filled or inferred from upstream claims.'''
          if stale_tail in text:
              text = text.replace(stale_tail, 'That pre-vendor checkpoint is retained as provenance for the frozen comparison contract; the independently observed vendor result and final closure are recorded below.', 1)

          final_section = f'''\n\n---\n\n## Final M13.5.3 observed result and closure\n\nIndependent evidence promotion completed on 2026-09-10 from the preserved M13.5.2 Vivado tree. The closure command re-parsed the native `timing_summary.rpt` and `utilization.rpt`, required byte-identical regeneration of the normalized result/comparison, verified every preserved evidence hash, reran the focused M13.5 tests and full project regression, and emitted the tracked machine-independent closure record.\n\n### Routed implementation result\n\n| Metric | Thesis M12.5 | Catalyst N1 |\n| --- | ---: | ---: |\n| Target part | `xck26-sfvc784-2LV-c` | `xczu5ev-sfvc784-2-i` |\n| Clock target | 100 MHz | 100 MHz |\n| Routed WNS | +0.493 ns | +0.001 ns |\n| Routed WHS | +0.011 ns | +0.013 ns |\n| CLB LUTs | 4,424 / 117,120 | 19,891 / 117,120 (16.98%) |\n| CLB registers | 4,280 / 234,240 | 30,850 / 234,240 (13.17%) |\n| Block RAM tiles | <=18 / 144 | 52.5 / 144 (36.46%) |\n| DSPs | 2 / 1,248 | 14 / 1,248 (1.12%) |\n| URAM | 0 / 64 | 0 / 64 (0.00%) |\n\nBoth implementations close the same nominal 10 ns constraint. The different WNS margins are **not** converted into an Fmax or architectural-efficiency claim. The designs differ in target-part string, configured capacity, feature scope, serialization/parallelism, host infrastructure, and validation/debug overhead. Resource totals are therefore contextual rather than a winner/loser metric.\n\nLatency/throughput remains withheld because the Catalyst routed flow does not establish an equivalent on-fabric architectural-timestep cycle boundary. Power/energy remains withheld because the project has no matching validated physical power methodology. Catalyst physical execution remains false; the implemented DCP is not relabeled as a programmed-board result.\n\n### Evidence identity\n\nThe compact tracked closure is `references/m13_5_closure.json` with schema `neuromorphic-twin-m13-hardware-closure-v1` and status `validated_complete`. Its preserved evidence-manifest SHA-256 is:\n\n```text\n{evidence_hash}\n```\n\nThe closure record also stores hashes for the normalized result/comparison and all 11 native Vivado reports/DCP products, while intentionally omitting machine-local absolute paths.\n\n### M13.5 conclusion\n\n**M13.5 is complete.** The exact pinned Catalyst N1 K26-class RTL was reproducibly implemented through route at 100 MHz under Vivado 2025.2, with positive setup and hold slack and source provenance intact. Because the pinned Catalyst release does not provide a complete directly programmable KV260 integration, routed implementation is the strongest source-supported Catalyst hardware boundary used by this thesis. No project computational baseline changed, and no M12 physical rerun is required by M13.5.\n'''
          if '## Final M13.5.3 observed result and closure' not in text:
              text = text.rstrip() + final_section + '\n'
          path.write_text(text, encoding='utf-8')

          # Finalize the dedicated M13.5.3 closure note.
          path = root / 'Neuromorphic Digital Twin/docs/M13_5_3_CLOSURE.md'
          text = path.read_text(encoding='utf-8')
          old = '**In progress — M13.5.2 independent Vivado 2025.2 reproduction passed; tracked evidence promotion is the remaining closure step.**'
          if old not in text:
              raise SystemExit('M13.5.3 status marker not found')
          text = text.replace(old, '**Status: Complete**', 1)
          old = 'After `references/m13_5_closure.json` is independently generated and reviewed, the remaining repository work is to record its observed resource numbers and evidence hash in the main M13.5 narrative and `MILESTONES.md`, run final source-level consistency checks, and merge the branch.'
          if old in text:
              text = text.replace(old, 'The independently generated `references/m13_5_closure.json` is now tracked and reviewed. Its observed resource/timing values and evidence identity are recorded in the main M13.5 narrative and `MILESTONES.md`; only final branch validation and merge remain outside this sub-milestone.', 1)

          final_section = f'''\n\n---\n\n## Final independently promoted evidence\n\nThe source-controlled closure command was independently executed against the preserved M13.5.2 Vivado evidence and passed:\n\n```text\n23 passed\n354 passed\nM13.5.3 closure validation PASS\n```\n\nThe resulting tracked authority records Catalyst routed WNS `+0.001 ns`, WHS `+0.013 ns`, **19,891** CLB LUTs, **30,850** CLB registers, **52.5** Block RAM tiles, **14** DSPs, and **0** URAM at the frozen 100 MHz target. The evidence-manifest SHA-256 is:\n\n```text\n{evidence_hash}\n```\n\nThe closure retains latency/throughput=`withheld`, power/energy=`withheld`, and Catalyst physical execution=`false`. The project side remains the independently validated M12.5 physical image with 22/22 workloads, 166/166 committed ticks, and zero mismatches.\n\n**M13.5.3 is complete.** No additional Catalyst board-programming step is required for this milestone because that integration is not supplied by the pinned upstream K26 source boundary.\n'''
          if '## Final independently promoted evidence' not in text:
              text = text.rstrip() + final_section + '\n'
          path.write_text(text, encoding='utf-8')

          # Finalize the milestone tracker without rewriting any earlier milestone history.
          path = root / 'MILESTONES.md'
          text = path.read_text(encoding='utf-8')
          replacements = {
              '**Repository evidence:** M13.1 merged via PR #14; M13.2 on branch `agent/m13-2-four-way-crosswalk`': '**Repository evidence:** M13.1-M13.4 merged to `main`; M13.5 closure on branch `agent/m13-5-catalyst-k26-reproduction` with tracked `references/m13_5_closure.json`',
              '- [ ] Define the common behavioral subset and explicit mapping/normalization rules before differential testing.': '- [x] Define the common behavioral subset and explicit mapping/normalization rules before differential testing.',
              '- [ ] Run directed architectural probes across the implementations that can express each case and preserve machine-readable evidence.': '- [x] Run directed architectural probes across the implementations that can express each case and preserve machine-readable evidence.',
              '- [ ] Reproduce a physical or RTL-level Catalyst comparison on the common K26 path if the pinned Catalyst release and available tooling support a defensible configuration; otherwise document the exact blocker and complete the strongest reproducible comparison boundary available.': '- [x] Reproduce a physical or RTL-level Catalyst comparison on the common K26 path if the pinned Catalyst release and available tooling support a defensible configuration; otherwise document the exact blocker and complete the strongest reproducible comparison boundary available.',
              '### M13.5 — Reproduce Catalyst at the strongest common FPGA/RTL boundary\n\n**Status:** In progress\n**Started:** 2026-09-10\n**Repository evidence:** branch `agent/m13-5-catalyst-k26-reproduction`; M13.5.1 automated preflight and M13.5.2 independent Vivado 2025.2 routed reproduction complete; M13.5.3 evidence promotion in progress': '### M13.5 — Reproduce Catalyst at the strongest common FPGA/RTL boundary\n\n**Status:** Complete\n**Started:** 2026-09-10\n**Completed:** 2026-09-10\n**Repository evidence:** branch `agent/m13-5-catalyst-k26-reproduction`; tracked closure `Neuromorphic Digital Twin/references/m13_5_closure.json`; independent Vivado 2025.2 reproduction and M13.5.3 evidence promotion complete',
              '**M13.5.1 is complete. M13.5.2 independently reproduced the pinned Catalyst routed flow under local Vivado 2025.2 on 2026-09-10. M13.5.3 is now the current boundary: validate and promote the preserved vendor evidence into the tracked closure record.**': '**M13.5.1, M13.5.2, and M13.5.3 are complete. The tracked M13.5 closure record is `Neuromorphic Digital Twin/references/m13_5_closure.json`.**',
              'The complete vendor outputs remain in the ignored local `build/m13_5/catalyst-k26-vivado/` tree until M13.5.3 validates and promotes the compact tracked closure artifact.': 'The complete vendor outputs remain in the ignored local `build/m13_5/catalyst-k26-vivado/` tree, while M13.5.3 promotes only the compact machine-independent closure record and evidence hashes into source control.',
              'M13.5.3 closure tooling has now passed **23/23 focused M13.5 tests** and the complete **354/354 project regression suite** in clean CI. The source-controlled closure command is `bash scripts/run_m13_5_closure.sh`.': 'M13.5.3 closure tooling passed **23/23 focused M13.5 tests** and the complete **354/354 project regression suite** in clean CI. Independent local execution of `bash scripts/run_m13_5_closure.sh` reproduced those pass counts and promoted the tracked closure artifact.',
              '#### Pass boundary\n\nA reproducible common hardware/RTL comparison has been completed at the strongest defensible boundary available, with enough configuration metadata to prevent misleading performance or resource claims.': '#### Pass boundary\n\n**Achieved.** The exact pinned Catalyst K26-class RTL reproduced through routed Vivado 2025.2 implementation at 100 MHz with positive setup/hold slack. The tracked closure records target-part/configuration distinctions, routed resources/timing, evidence hashes, and explicit exclusions for latency/throughput, power/energy, and physical Catalyst execution. Routed implementation is the strongest source-supported boundary supplied by the pinned release.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'MILESTONES replacement marker not found: {old[:90]!r}')
              text = text.replace(old, new, 1)

          insertion_marker = '\n#### Preferred physical comparison\n'
          if insertion_marker not in text:
              raise SystemExit('M13.5 insertion marker not found')
          completion = f'''\n#### M13.5.3 completion evidence\n\nIndependent local evidence promotion on 2026-09-10 validated the complete preserved vendor tree, independently re-parsed native routed timing/utilization reports, regenerated the normalized hardware comparison, verified every SHA-256 entry, and produced `Neuromorphic Digital Twin/references/m13_5_closure.json` with status `validated_complete`. The same closure command passed **23/23 focused M13.5 tests** and the complete **354/354 project regression suite**.\n\nFinal Catalyst routed result at the frozen 100 MHz / 10 ns target:\n\n```text\ntarget part:      xczu5ev-sfvc784-2-i\nrouted WNS:       +0.001 ns\nrouted WHS:       +0.013 ns\nCLB LUTs:         19,891 / 117,120  (16.98%)\nCLB registers:    30,850 / 234,240  (13.17%)\nBlock RAM tiles:  52.5 / 144        (36.46%)\nDSPs:             14 / 1,248        (1.12%)\nURAM:             0 / 64            (0.00%)\n```\n\nThe project M12.5 result remains `+0.493 ns` WNS / `+0.011 ns` WHS with 4,424 LUTs, 4,280 registers, `<=18` BRAM tiles, 2 DSPs, and 0 URAM on `xck26-sfvc784-2LV-c`. These resource/timing rows are contextual only: the target strings, configured capacities, architectural scope, serialization/parallelism, and debug/host infrastructure differ. No maximum-Fmax or efficiency ranking is inferred.\n\nLatency/throughput and power/energy comparisons remain withheld, and Catalyst physical execution remains false. The preserved evidence-manifest SHA-256 is `{evidence_hash}`. No project computational-core/HLS/FPGA-v1 behavior changed, so M13.5 requires no M12 physical revalidation.\n'''
          if '#### M13.5.3 completion evidence' not in text:
              text = text.replace(insertion_marker, completion + insertion_marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install project
        run: python3 -m pip install -e 'Neuromorphic Digital Twin'

      - name: Focused final M13.5 tests
        working-directory: Neuromorphic Digital Twin
        run: |
          python3 -m pytest --override-ini addopts='' -q \
            tests/test_m13_5_hardware_audit.py \
            tests/test_m13_5_hardware_comparison.py \
            tests/test_m13_5_hardware_closure.py \
            tests/test_m13_5_tracked_closure.py

      - name: Complete project regression
        working-directory: Neuromorphic Digital Twin
        run: python3 -m pytest --override-ini addopts='' -q

      - name: Verify frozen baseline remains untouched
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD > /tmp/m13_5_files.txt
          if grep -E '^Neuromorphic Digital Twin/(hls/core_v1|rtl/core_v1|src/neuromorphic_twin/(model|arithmetic|core|routing|weights)\.py)' /tmp/m13_5_files.txt; then
            echo 'ERROR: M13.5 changed a frozen computational baseline path.' >&2
            exit 2
          fi

      - name: Commit final M13.5 documentation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/m13_5_finalize_docs_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MILESTONES.md \
            'Neuromorphic Digital Twin/docs/M13_5_CATALYST_K26_REPRODUCTION.md' \
            'Neuromorphic Digital Twin/docs/M13_5_3_CLOSURE.md' \
            .github/workflows/m13_5_finalize_docs_once.yml
          git commit -m 'Close M13.5 Catalyst hardware reproduction'
          git push origin HEAD:agent/m13-5-catalyst-k26-reproduction
