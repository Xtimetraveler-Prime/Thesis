name: M12.3 Python gate

on:
  push:
    branches:
      - agent/m12-3-multitick-recurrent-physical
    paths:
      - .github/workflows/m12_3_python_gate.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run directed M12.3 corpus tests
        working-directory: Neuromorphic Digital Twin
        run: |
          python -m pytest -q tests/test_m12_3_multitick_conformance.py
          PYTHONPATH=src python examples/generate_m12_3_multitick_corpus.py --output-dir /tmp/m12_3_corpus --sv-output /tmp/generated_m12_3_multitick_cases.svh
          grep -F 'INPUTS ONLY' /tmp/generated_m12_3_multitick_cases.svh
          if grep -E 'EXPECTED|RECURRENT_EVENTS|RECURRENT_SCHEDULE' /tmp/generated_m12_3_multitick_cases.svh; then
            echo 'ERROR: golden/recurrent schedule leaked into FPGA-visible include' >&2
            exit 1
          fi
