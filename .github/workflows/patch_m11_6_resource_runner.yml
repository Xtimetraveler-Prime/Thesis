name: Patch M11.6 resource runner

on:
  push:
    branches:
      - agent/m11-6-bitstream-hardware-smoke
    paths:
      - .github/workflows/patch_m11_6_resource_runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-6-bitstream-hardware-smoke
          fetch-depth: 0
      - name: Apply resource runner patch
        run: python3 scripts/patch_m11_6_resource_runner.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Neuromorphic Digital Twin/rtl/core_v1/run_m11_6_bitstream.sh" \
                  "Neuromorphic Digital Twin/tests/test_m11_6_bitstream_sources.py"
          git commit -m "Use robust implemented-resource check in M11.6"
          git push origin HEAD:agent/m11-6-bitstream-hardware-smoke
