name: Close M12 documentation

on:
  push:
    branches:
      - agent/m12-5-fpga-characterization
    paths:
      - scripts/close_m12_5.py
      - .github/workflows/m12_5_close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-5-fpga-characterization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/close_m12_5.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md
          git diff --cached --check
          git commit -m "Close M12 physical validation milestone"
          git push origin HEAD:agent/m12-5-fpga-characterization
