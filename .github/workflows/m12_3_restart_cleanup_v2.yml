name: M12.3 restart cleanup v2
on:
  push:
    branches: [agent/m12-3-multitick-recurrent-physical]
    paths: [.github/workflows/m12_3_restart_cleanup_v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-3-multitick-recurrent-physical
      - run: python scripts/fix_m12_3_restart.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Neuromorphic Digital Twin/rtl/core_v1/m12_3_multitick_capture_controller_v1.sv'
          git commit -m 'Normalize M12.3 case restart state'
          git push origin HEAD:agent/m12-3-multitick-recurrent-physical
