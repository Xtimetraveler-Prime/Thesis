name: M13.5 documentation chronology cleanup once

on:
  push:
    branches:
      - agent/m13-5-catalyst-k26-reproduction
    paths:
      - '.github/workflows/m13_5_doc_chronology_cleanup_once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-5-catalyst-k26-reproduction

      - name: Remove stale pre-closure wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('MILESTONES.md'): {
                  'The final tracked-result source gate adds four invariants, for **23/23 focused M13.5 tests** and **358/358 complete project tests**.': 'The final tracked-result source gate passed **23/23 focused M13.5 tests** and **358/358 complete project tests**.',
                  'A final tracked-result source gate adds four exact closure invariants and is expected to pass **23/23 focused M13.5 tests** and **358/358 complete project tests** before merge.': 'The final tracked-result source gate added the tracked closure invariants and passed **23/23 focused M13.5 tests** and **358/358 complete project tests** before merge.',
              },
              Path('Neuromorphic Digital Twin/docs/M13_5_CATALYST_K26_REPRODUCTION.md'): {
                  'the final tracked-result source gate extends those counts to **23/23 focused** and **358/358 complete** tests.': 'the final tracked-result source gate subsequently passed **23/23 focused** and **358/358 complete** tests.',
              },
              Path('Neuromorphic Digital Twin/docs/M13_5_3_CLOSURE.md'): {
                  'This validates the promotion machinery itself; the independent local evidence tree is still required to generate `references/m13_5_closure.json`.': 'This pre-promotion checkpoint validated the promotion machinery; the independent local closure subsequently generated and tracked `references/m13_5_closure.json`.',
                  'The final source-level tracked-result gate adds four invariants, bringing the expected clean branch totals to **23 focused M13.5 tests** and **358 project tests**.': 'The final source-level tracked-result gate passed **23/23 focused M13.5 tests** and **358/358 complete project tests** with the tracked closure invariants included.',
              },
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits.items():
                  if old not in text:
                      raise SystemExit(f'missing chronology marker in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          combined = '\n'.join(path.read_text(encoding='utf-8') for path in replacements)
          assert 'expected clean branch totals' not in combined
          assert 'is expected to pass **23/23' not in combined
          assert 'still required to generate `references/m13_5_closure.json`' not in combined
          assert combined.count('358/358') >= 3
          PY

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/m13_5_doc_chronology_cleanup_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MILESTONES.md \
            'Neuromorphic Digital Twin/docs/M13_5_CATALYST_K26_REPRODUCTION.md' \
            'Neuromorphic Digital Twin/docs/M13_5_3_CLOSURE.md' \
            .github/workflows/m13_5_doc_chronology_cleanup_once.yml
          git commit -m 'Clarify final M13.5 closure chronology'
          git push origin HEAD:agent/m13-5-catalyst-k26-reproduction
