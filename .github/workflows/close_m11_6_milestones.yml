name: Close M11.6 milestones

on:
  push:
    branches:
      - agent/m11-6-bitstream-hardware-smoke
    paths:
      - .github/workflows/close_m11_6_milestones.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-6-bitstream-hardware-smoke
          fetch-depth: 0
      - name: Apply milestone closure update
        run: python3 scripts/close_m11_6_milestones.py
      - name: Validate closure markers
        shell: bash
        run: |
          grep -Fq '| M11 | Implement first FPGA neuron/core datapath | Complete | 2026-08-20 | 2026-08-27 |' MILESTONES.md
          grep -Fq '**Status:** Complete' MILESTONES.md
          grep -Fq 'M11.6 physical VIO smoke passed: tick=00000004, fail_code=00' MILESTONES.md
          grep -Fq 'M11.6 routed timing check passed: WNS=1.480 ns, WHS=0.012 ns' MILESTONES.md
          grep -Fq 'C_AUX_RESET_HIGH=0' MILESTONES.md
          grep -Fq '### Why M11.6 passes' MILESTONES.md
      - name: Commit milestone closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md
          git commit -m "Close M11.6 after physical K26 smoke"
          git push origin HEAD:agent/m11-6-bitstream-hardware-smoke
