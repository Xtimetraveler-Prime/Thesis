name: M13.1 timeout portability preflight

on:
  push:
    branches:
      - agent/m13-1-pin-catalyst-methodology
    paths:
      - '.github/workflows/m13_1_timeout_preflight.yml'
      - 'Neuromorphic Digital Twin/scripts/run_m13_1_catalyst_rtl_regression.sh'
      - 'Neuromorphic Digital Twin/tests/test_m13_1_reference_manifest.py'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout thesis branch
        uses: actions/checkout@v4
        with:
          ref: agent/m13-1-pin-catalyst-methodology
          path: thesis
      - name: Checkout pinned Catalyst N1
        uses: actions/checkout@v4
        with:
          repository: catalyst-neuromorphic/catalyst-n1
          ref: 1806bb4b4114d7671e5648fa75b7b83b3a8d5543
          fetch-depth: 0
          path: catalyst-n1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and Icarus
        run: |
          cd 'thesis/Neuromorphic Digital Twin'
          python -m pip install -e '.[dev,compare]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
      - name: Focused M13.1 source tests
        run: |
          cd 'thesis/Neuromorphic Digital Twin'
          python -m pytest -q tests/test_m13_1_reference_manifest.py
          bash -n scripts/run_m13_1_catalyst_rtl_regression.sh
      - name: Complete thesis regression suite
        run: |
          cd 'thesis/Neuromorphic Digital Twin'
          python -m pytest -q
      - name: Full pinned Catalyst native RTL regression
        env:
          M13_1_TB_TIMEOUT_SECONDS: '300'
        run: |
          cd 'thesis/Neuromorphic Digital Twin'
          bash scripts/run_m13_1_catalyst_rtl_regression.sh \
            "$GITHUB_WORKSPACE/catalyst-n1" \
            "$GITHUB_WORKSPACE/m13_1_timeout_rtl"
