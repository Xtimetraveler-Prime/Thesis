name: Patch M11.6 VIO proc reset

on:
  push:
    branches:
      - agent/m11-6-bitstream-hardware-smoke
    paths:
      - .github/workflows/patch_m11_6_vio_proc_reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-6-bitstream-hardware-smoke
          fetch-depth: 0
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Apply synchronized VIO reset revision
        run: python3 scripts/patch_m11_6_vio_proc_reset.py
      - name: Run focused source regressions
        working-directory: Neuromorphic Digital Twin
        run: python3 -m pytest -q tests/test_m11_6_bitstream_sources.py tests/test_m11_6_resource_checker.py
      - name: Commit revision
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Neuromorphic Digital Twin/docs/M11_6_BITSTREAM_HARDWARE_SMOKE.md" \
            "Neuromorphic Digital Twin/rtl/core_v1/m11_6_smoke_controller_v1.sv" \
            "Neuromorphic Digital Twin/rtl/core_v1/m11_6_smoke_controller_bd_v1.v" \
            "Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m11_6_project.tcl" \
            "Neuromorphic Digital Twin/tests/test_m11_6_bitstream_sources.py"
          git commit -m "Synchronize M11.6 VIO reset through proc_sys_reset"
          git push origin HEAD:agent/m11-6-bitstream-hardware-smoke
