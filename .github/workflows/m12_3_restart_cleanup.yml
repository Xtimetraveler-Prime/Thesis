name: Clean M12.3 restart paths

on:
  push:
    branches:
      - agent/m12-3-multitick-recurrent-physical
    paths:
      - .github/workflows/m12_3_restart_cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-3-multitick-recurrent-physical
      - name: Normalize case restart tick index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Neuromorphic Digital Twin/rtl/core_v1/m12_3_multitick_capture_controller_v1.sv')
          text = p.read_text()
          duplicate = '''                        active_case_id <= trace_read_addr[7:0];
                        tick_index <= 8'd0;
                        capture_done <= 1'b0;
                        capture_fault <= 1'b0;
                        capture_fault_code <= CAPTURE_FAULT_NONE;
                        load_index <= 13'd0;
                        tick_index <= 8'd0;
                        watchdog <= 24'd0;
'''
          clean = '''                        active_case_id <= trace_read_addr[7:0];
                        tick_index <= 8'd0;
                        capture_done <= 1'b0;
                        capture_fault <= 1'b0;
                        capture_fault_code <= CAPTURE_FAULT_NONE;
                        load_index <= 13'd0;
                        watchdog <= 24'd0;
'''
          if duplicate not in text:
              raise SystemExit('duplicate restart anchor missing')
          text = text.replace(duplicate, clean, 1)

          fail_old = '''                S_FAIL: begin
                    if (capture_start_pulse) begin
                        active_case_id <= trace_read_addr[7:0];
                        capture_done <= 1'b0;
                        capture_fault <= 1'b0;
                        capture_fault_code <= CAPTURE_FAULT_NONE;
                        load_index <= 13'd0;
                        watchdog <= 24'd0;
'''
          fail_new = '''                S_FAIL: begin
                    if (capture_start_pulse) begin
                        active_case_id <= trace_read_addr[7:0];
                        tick_index <= 8'd0;
                        capture_done <= 1'b0;
                        capture_fault <= 1'b0;
                        capture_fault_code <= CAPTURE_FAULT_NONE;
                        load_index <= 13'd0;
                        watchdog <= 24'd0;
'''
          if fail_old not in text:
              raise SystemExit('S_FAIL restart anchor missing')
          text = text.replace(fail_old, fail_new, 1)
          p.write_text(text)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Neuromorphic Digital Twin/rtl/core_v1/m12_3_multitick_capture_controller_v1.sv'
          git commit -m 'Normalize M12.3 case restart state'
          git push origin HEAD:agent/m12-3-multitick-recurrent-physical
