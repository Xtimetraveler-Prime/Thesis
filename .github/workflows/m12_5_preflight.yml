name: M12.5 preflight gate

on:
  push:
    branches:
      - agent/m12-5-fpga-characterization

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neuromorphic Digital Twin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-5-fpga-characterization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python and RTL test dependencies
        run: |
          python -m pip install -e '.[dev,compare]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator iverilog
      - name: Focused M12.5 tests
        run: |
          python -m pytest -q \
            tests/test_m12_5_characterization.py \
            tests/test_m12_5_capture_sources.py
      - name: Complete regression suite
        run: python -m pytest -q
      - name: Generate frozen M12.4 characterization corpus
        run: |
          rm -rf /tmp/m12_5_gate
          mkdir -p /tmp/m12_5_gate
          PYTHONPATH=src python examples/generate_m12_4_broad_corpus.py \
            --output-dir /tmp/m12_5_gate/golden \
            --sv-output /tmp/m12_5_gate/generated_m12_4_broad_cases.svh | tee /tmp/m12_5_gate/generate.log
          grep -F 'M12.4 broad deterministic corpus generated: version=m12.4-generator-v1 cases=22 ticks=166' /tmp/m12_5_gate/generate.log
          if grep -E 'M12_4_EXPECTED|RECURRENT_SCHEDULE|GOLDEN_STATE|GOLDEN_SPIKE' /tmp/m12_5_gate/generated_m12_4_broad_cases.svh; then
            echo 'ERROR: golden/recurrent schedule data leaked into M12.5 FPGA-visible corpus' >&2
            exit 1
          fi
      - name: Lint passive M12.5 characterization hierarchy
        working-directory: Neuromorphic Digital Twin/rtl/core_v1
        run: |
          verilator --lint-only --timing -Wno-fatal \
            --top-module m12_5_characterization_capture_controller_v1 \
            -I/tmp/m12_5_gate \
            m08_weight_decoder_v1.sv \
            phase_b_synapse_accumulator_v1.sv \
            neuron_array_controller_v1.sv \
            integrated_core_controller_v1.sv \
            recurrent_route_queue_v1.sv \
            recurrent_integrated_core_controller_v1.sv \
            m12_trace_read_bridge_v1.sv \
            m12_5_characterization_capture_controller_v1.sv
      - name: Regress M12.2 synchronous recurrent-bank fix
        working-directory: Neuromorphic Digital Twin/rtl/core_v1
        run: |
          iverilog -g2012 -o /tmp/m12_5_gate/bank_latch.vvp \
            recurrent_route_queue_v1.sv tb/tb_m12_2_recurrent_debug_bank_latch.sv
          vvp /tmp/m12_5_gate/bank_latch.vvp | tee /tmp/m12_5_gate/bank_latch.log
          grep -F 'M12.2 recurrent debug bank-latch regression passed' /tmp/m12_5_gate/bank_latch.log
      - name: Check M12.5 runner and evidence identities
        working-directory: Neuromorphic Digital Twin/rtl/core_v1
        run: |
          bash -n run_m12_5_bitstream.sh
          bash -n run_m12_5_hardware_characterization.sh
          grep -F 'LOG_FILE="$LOCAL_BUILD_DIR/m12_5_vivado.log"' run_m12_5_bitstream.sh
          grep -F 'M12.5 routed bitstream flow completed successfully.' run_m12_5_bitstream.sh
          grep -F 'M12.5 physical characterization completed successfully.' run_m12_5_hardware_characterization.sh
