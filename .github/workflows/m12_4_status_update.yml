name: Mark M12.4 in progress

on:
  push:
    branches:
      - agent/m12-4-broad-physical-regression
    paths:
      - scripts/mark_m12_4_in_progress.py
      - .github/workflows/m12_4_status_update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-4-broad-physical-regression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mark_m12_4_in_progress.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md
          git diff --cached --check
          git commit -m "Mark M12.4 broad physical regression in progress"
          git push origin HEAD:agent/m12-4-broad-physical-regression
