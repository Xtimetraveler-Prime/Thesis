name: Apply M12.2 reset-before-reload route fix

on:
  push:
    branches:
      - agent/m12-2-single-tick-physical
    paths:
      - .github/workflows/m12_2_route_reload_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-2-single-tick-physical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch per-case reset/load ordering and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          ctrl = Path('Neuromorphic Digital Twin/rtl/core_v1/m12_2_single_tick_capture_controller_v1.sv')
          text = ctrl.read_text()
          text = text.replace(
              '// Unlike the fixed reset-state M12.1 workload, M12.2 must test arbitrary\n'
              '// pre-tick state. Configuration/weight/route memories are loaded first, the\n'
              '// architectural core is reset, and only THEN are the selected case\'s initial\n'
              '// neuron state words written. This preserves reset determinism while allowing\n'
              '// saturation/refractory boundary probes to begin from non-reset state.\n',
              '// Unlike the fixed one-shot M12.1 workload, M12.2 repeatedly reconfigures the\n'
              '// same physical core. Each selected case therefore begins with architectural\n'
              '// reset, then loads ALL case-specific static memories (config/weights/routes),\n'
              '// then loads arbitrary initial state/external events. This guarantees that no\n'
              '// write races residual activity from the previous case while preserving the\n'
              '// frozen computational semantics.\n'
          )
          text = text.replace(
              '                        end else begin\n                            state <= S_LOAD_CONFIG;\n                        end\n',
              '                        end else begin\n                            // Reset first so repeated physical cases reconfigure only from a\n                            // clean idle boundary; static memories are loaded after reset.\n                            state <= S_RESET_PULSE;\n                        end\n'
          )
          text = text.replace(
              '                        if (case_route_count == 0) begin\n                            watchdog <= 24\'d0;\n                            state <= S_RESET_PULSE;\n                        end else begin\n                            state <= S_LOAD_ROUTE_TARGET;\n                        end\n',
              '                        if (case_route_count == 0) begin\n                            state <= S_LOAD_STATE;\n                        end else begin\n                            state <= S_LOAD_ROUTE_TARGET;\n                        end\n'
          )
          text = text.replace(
              '                S_LOAD_ROUTE_TARGET: begin\n                    if (load_index + 13\'d1 >= case_route_count) begin\n                        load_index <= 13\'d0;\n                        watchdog <= 24\'d0;\n                        state <= S_RESET_PULSE;\n                    end else load_index <= load_index + 13\'d1;\n                end\n',
              '                S_LOAD_ROUTE_TARGET: begin\n                    if (load_index + 13\'d1 >= case_route_count) begin\n                        load_index <= 13\'d0;\n                        state <= S_LOAD_STATE;\n                    end else load_index <= load_index + 13\'d1;\n                end\n'
          )
          text = text.replace(
              '                            // M12.2 initial state is intentionally loaded AFTER\n'
              '                            // architectural reset so arbitrary pre-tick state survives.\n'
              '                            load_index <= 13\'d0;\n'
              '                            state <= S_LOAD_STATE;\n',
              '                            // M12.2 reconfiguration begins only AFTER architectural\n'
              '                            // reset, guaranteeing a clean idle boundary for route/config\n'
              '                            // writes before arbitrary pre-tick state is loaded.\n'
              '                            load_index <= 13\'d0;\n'
              '                            state <= S_LOAD_CONFIG;\n'
          )
          ctrl.write_text(text)

          test = Path('Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py')
          t = test.read_text()
          t = t.replace(
              'def test_arbitrary_initial_state_is_loaded_only_after_architectural_reset() -> None:\n'
              '    text = CONTROLLER.read_text(encoding="utf-8")\n\n'
              '    reset_wait = text.index("S_RESET_WAIT: begin")\n'
              '    load_state = text.index("S_LOAD_STATE: begin", reset_wait)\n'
              '    load_external = text.index("S_LOAD_EXTERNAL: begin", load_state)\n'
              '    ready = text.index("S_READY_TICK: begin", load_external)\n'
              '    assert reset_wait < load_state < load_external < ready\n\n'
              '    reset_block = text[reset_wait:load_state]\n'
              '    assert "core_reset_done" in reset_block\n'
              '    assert "state <= S_LOAD_STATE;" in reset_block\n'
              '    assert "M12.2 initial state is intentionally loaded AFTER" in text\n',
              'def test_each_case_resets_before_static_reload_and_initial_state() -> None:\n'
              '    text = CONTROLLER.read_text(encoding="utf-8")\n\n'
              '    reset_wait = text.index("S_RESET_WAIT: begin")\n'
              '    reset_block = text[reset_wait:text.index("S_LOAD_STATE: begin", reset_wait)]\n'
              '    assert "core_reset_done" in reset_block\n'
              '    assert "state <= S_LOAD_CONFIG;" in reset_block\n'
              '    assert "reconfiguration begins only AFTER architectural" in text\n'
              '    assert "state <= S_LOAD_STATE;" in text[text.index("S_LOAD_ROUTE_TARGET: begin"):reset_wait]\n'
          )
          t = t.replace(
              '    assert "if (case_route_count == 0)" in text\n'
              '    assert "state <= S_RESET_PULSE;" in text\n',
              '    assert "if (case_route_count == 0)" in text\n'
              '    assert "state <= S_LOAD_STATE;" in text\n'
          )
          test.write_text(t)

          conf = Path('Neuromorphic Digital Twin/tests/test_m12_2_single_tick_conformance.py')
          c = conf.read_text()
          c += '''\n\ndef test_case07_preserves_nonzero_physical_route_target() -> None:\n    cases = build_m12_single_tick_cases()\n    case = cases[7]\n    assert case.name == "threshold-over-refractory-entry"\n    assert case.routes.target_axons == (1,)\n    assert case.expected.snapshot.spikes == (True,)\n    assert case.expected.snapshot.routed_output_axons == (1,)\n'''
          conf.write_text(c)
          PY
      - name: Run focused M12.2 tests
        working-directory: Neuromorphic Digital Twin
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_m12_2_single_tick_conformance.py tests/test_m12_2_capture_sources.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Neuromorphic Digital Twin/rtl/core_v1/m12_2_single_tick_capture_controller_v1.sv' \
                  'Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py' \
                  'Neuromorphic Digital Twin/tests/test_m12_2_single_tick_conformance.py'
          git commit -m 'Reset before M12.2 per-case route reload'
          git push origin HEAD:agent/m12-2-single-tick-physical
