name: Derive M12.3 capture Tcl

on:
  push:
    branches:
      - agent/m12-3-multitick-recurrent-physical
    paths:
      - .github/workflows/m12_3_derive_capture_tcl.yml

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-3-multitick-recurrent-physical
      - run: python scripts/derive_m12_3_capture_tcl.py
      - name: Verify multi-tick capture contract
        run: |
          grep -F 'case_id\tcase_name\tneuron_count\ttick_count' 'Neuromorphic Digital Twin/rtl/core_v1/vivado/capture_m12_3_multitick.tcl'
          grep -F 'for {set expected_tick 1} {$expected_tick <= $tick_count} {incr expected_tick}' 'Neuromorphic Digital Twin/rtl/core_v1/vivado/capture_m12_3_multitick.tcl'
          grep -F 'M12.3 physical directed multi-tick suite capture completed successfully:' 'Neuromorphic Digital Twin/rtl/core_v1/vivado/capture_m12_3_multitick.tcl'
          grep -F 'consumed_space' 'Neuromorphic Digital Twin/rtl/core_v1/vivado/capture_m12_3_multitick.tcl'
          grep -F 'routed_space' 'Neuromorphic Digital Twin/rtl/core_v1/vivado/capture_m12_3_multitick.tcl'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Neuromorphic Digital Twin/rtl/core_v1/vivado/capture_m12_3_multitick.tcl'
          git commit -m 'Add M12.3 multi-tick Hardware Manager capture flow'
          git push origin HEAD:agent/m12-3-multitick-recurrent-physical
