name: Finalize M12.1 milestone tracker

on:
  push:
    branches:
      - agent/m12-1-closure
    paths:
      - .github/workflows/finalize_m12_1_milestones.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-1-closure
          fetch-depth: 0
      - name: Finalize M12.1 tracker
        run: python3 scripts/finalize_m12_1_milestones.py
      - name: Validate completion markers
        shell: bash
        run: |
          grep -Fq '**Status:** Complete' MILESTONES.md
          grep -Fq '#### M12.1.4 — Prove repeated physical capture reproducibility and close M12.1' MILESTONES.md
          grep -Fq 'M12.1.4 repeated physical capture closure completed successfully.' MILESTONES.md
          grep -Fq '**Achieved.** A deterministic physical workload' MILESTONES.md
      - name: Commit final M12.1 milestone evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize_m12_1_milestones.yml scripts/finalize_m12_1_milestones.py
          git add MILESTONES.md
          git commit -m "Close M12.1 physical trace capture milestone"
          git push origin HEAD:agent/m12-1-closure
