name: M13.4 reconcile M13.3 baseline once

on:
  push:
    branches:
      - agent/m13-4-directed-differential-probes
    paths:
      - '.github/workflows/m13_4_reconcile_once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-4-directed-differential-probes
          fetch-depth: 0

      - name: Merge completed M13.3 baseline and resolve expected overlaps
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          cp MILESTONES.md /tmp/m13_4_milestones_before_merge.md
          cp 'Neuromorphic Digital Twin/pyproject.toml' /tmp/m13_4_pyproject_before_merge.toml

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ] && [ "$merge_rc" -ne 1 ]; then
            echo "Unexpected git merge exit code: $merge_rc" >&2
            exit "$merge_rc"
          fi

          unresolved="$(git diff --name-only --diff-filter=U | sort)"
          if [ -n "$unresolved" ]; then
            while IFS= read -r path; do
              case "$path" in
                'MILESTONES.md'|'Neuromorphic Digital Twin/pyproject.toml') ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 2
                  ;;
              esac
            done <<< "$unresolved"
          fi

          # Main is authoritative through M13.3; preserve the already validated
          # M13.4 section from the pre-normalization branch.
          git show origin/main:MILESTONES.md > /tmp/m13_4_milestones_main.md
          python - <<'PY'
          from pathlib import Path

          main = Path('/tmp/m13_4_milestones_main.md').read_text(encoding='utf-8')
          old = Path('/tmp/m13_4_milestones_before_merge.md').read_text(encoding='utf-8')
          start = '### M13.4 — Run directed differential architectural probes\n'
          end = '\n---\n\n### M13.5 — Reproduce Catalyst at the strongest common FPGA/RTL boundary\n'

          def section(text: str) -> str:
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          merged = main.replace(section(main), section(old), 1)
          Path('MILESTONES.md').write_text(merged, encoding='utf-8')
          PY

          # The branch version has the same exact pins as main plus the useful
          # Class-H compatibility comment; keep it.
          cp /tmp/m13_4_pyproject_before_merge.toml 'Neuromorphic Digital Twin/pyproject.toml'

          git add MILESTONES.md 'Neuromorphic Digital Twin/pyproject.toml'
          git rm .github/workflows/m13_4_reconcile_once.yml

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'Merge completed M13.3 baseline into M13.4 development'
          git push origin HEAD:agent/m13-4-directed-differential-probes
