name: Close M12.2 docs v2

on:
  push:
    branches:
      - agent/m12-2-single-tick-physical
    paths:
      - .github/workflows/m12_2_close_docs_v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-2-single-tick-physical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/m12_2_close_docs.py
      - run: |
          grep -F 'M12.2 exact physical single-tick differential passed: cases=16 mismatches=0' MILESTONES.md
          grep -F 'Status: **Resolved — M12.2 physical conformance closed**' 'Neuromorphic Digital Twin/docs/M12_2_ROUTE_TARGET_DEBUG.md'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MILESTONES.md 'Neuromorphic Digital Twin/docs/M12_2_ROUTE_TARGET_DEBUG.md'
          git commit -m 'Close M12.2 physical single-tick conformance'
          git push origin HEAD:agent/m12-2-single-tick-physical
# retry after robust status-line handling
