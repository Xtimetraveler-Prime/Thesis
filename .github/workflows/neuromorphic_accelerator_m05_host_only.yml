name: Neuromorphic Accelerator v1 M05 stream and event replay (NO BOARD)
on:
  push:
    paths:
      - "Neuromorphic_Accelerator/v1/**"
      - ".github/workflows/neuromorphic_accelerator_m05_host_only.yml"
  pull_request:
    paths:
      - "Neuromorphic_Accelerator/v1/**"
      - ".github/workflows/neuromorphic_accelerator_m05_host_only.yml"
  workflow_dispatch:

jobs:
  m05-host-stream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: Neuromorphic_Accelerator/v1
    steps:
      - uses: actions/checkout@v4
      - name: Native compiler and source version
        run: |
          python3 --version
          g++ --version
          git rev-parse HEAD
      - name: Python syntax (no hardware)
        run: python3 -m compileall -q src scripts tests
      - name: M05 native stream, state, accumulator, and Vitis workdir-path regression
        run: python3 -m unittest discover -s tests -p 'test_m05*.py' -v
      - name: HLS Csim vector testbench native-only compile/smoke (NOT Vitis)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Wno-unknown-pragmas \
            hls/m04_lif_eval/m04_eval.cpp \
            hls/m05_stream_eval/m05_stream.cpp \
            hls/m05_stream_eval/m05_hls_csim_tb.cpp \
            -o "$RUNNER_TEMP/m05_hls_tb_host"
          "$RUNNER_TEMP/m05_hls_tb_host"
      - name: Stateful BRAM-candidate Csim bench compiled natively (NOT Vitis)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Wno-unknown-pragmas \
            hls/m04_lif_eval/m04_eval.cpp \
            hls/m05_stateful/m05_stateful.cpp \
            hls/m05_stateful/m05_stateful_csim_tb.cpp \
            -o "$RUNNER_TEMP/m05_stateful_tb_host"
          "$RUNNER_TEMP/m05_stateful_tb_host"
      - name: Tick-sealed signed accumulator HLS vectors compiled natively (NOT Vitis)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Wno-unknown-pragmas \
            hls/m05_accumulator/m05_accumulator.cpp \
            hls/m05_accumulator/m05_accum_csim_tb.cpp \
            -o "$RUNNER_TEMP/m05_accumulator_tb_host"
          "$RUNNER_TEMP/m05_accumulator_tb_host"
      - name: Integrated finite-horizon PL candidate Csim bench compiled natively (NOT Vitis)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Wno-unknown-pragmas \
            hls/m04_lif_eval/m04_eval.cpp \
            hls/m05_integrated/m05_integrated.cpp \
            hls/m05_integrated/m05_integrated_csim_tb.cpp \
            -o "$RUNNER_TEMP/m05_integrated_tb_host"
          "$RUNNER_TEMP/m05_integrated_tb_host"
      - name: Rolling 8-slot temporal wheel HLS Csim bench compiled natively (NOT Vitis)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Wno-unknown-pragmas \
            hls/m04_lif_eval/m04_eval.cpp \
            hls/m05_rolling/m05_rolling.cpp \
            hls/m05_rolling/m05_rolling_csim_tb.cpp \
            -o "$RUNNER_TEMP/m05_rolling_tb_host"
          "$RUNNER_TEMP/m05_rolling_tb_host"
      - name: Accepted M04 M03 M02 M01 regression suites
        run: |
          python3 -m unittest discover -s tests -p 'test_m04*.py' -q
          python3 -m unittest discover -s tests -p 'test_m03*.py' -q
          python3 -m unittest discover -s tests -p 'test_m02*.py' -q
          python3 -m unittest discover -s tests -p 'test_m01*.py' -q
      - name: Source SHA256 (host code, not bitstream)
        run: |
          sha256sum \
            hls/m05_stream_eval/m05_stream.hpp \
            hls/m05_stream_eval/m05_stream.cpp \
            hls/m05_stream_eval/m05_stream_host_cli.cpp \
            src/neuromorphic_accelerator_v1/m05_host_runtime.py \
            tests/test_m05_stream.py \
            tests/test_m05_stateful.py \
            tests/test_m05_hls_setup.py \
            tests/test_m05_hls_path_regression.py \
            hls/m05_stream_eval/prepare_hls_config.py \
            tests/test_m05_accumulator.py \
            hls/m05_accumulator/m05_accumulator.hpp \
            hls/m05_accumulator/m05_accumulator.cpp \
            hls/m05_accumulator/m05_accum_hls_config.cfg \
            hls/m05_stateful/m05_stateful.hpp \
            hls/m05_stateful/m05_stateful.cpp \
            hls/m05_stateful/m05_stateful_hls_config.cfg \
            hls/m05_stream_eval/m05_hls_config.cfg \
            hls/m05_integrated/m05_integrated.hpp \
            hls/m05_integrated/m05_integrated.cpp \
            hls/m05_integrated/m05_integrated_host_cli.cpp \
            hls/m05_integrated/m05_integrated_csim_tb.cpp \
            hls/m05_integrated/m05_integrated_hls_config.cfg \
            tests/test_m05_integrated.py \
            tests/test_m05_rolling.py \
            tests/test_m05_trace_commit.py \
            tests/test_m05_hls_evidence_audit.py \
            scripts/m05_hls_evidence_audit.py \
            tests/test_m05_axis_rtl_prep.py \
            scripts/m05_axis_regmap.py \
            scripts/m05_rtl_meminit.py \
            tests/test_m05_rtl_meminit.py \
            scripts/run_m05_rolling_rtl_stress.sh \
            hls/m05_rolling/rtl_stress/tb_m05_rolling_axis_stress.sv \
            hls/m05_rolling/rtl_stress/tb_m05_rolling_axis_ingress_stress.sv \
            hls/m05_rolling/rtl_stress/tb_m05_rolling_axis_late_error.sv \
            scripts/m05_rtl_transaction_replay.py \
            tests/test_m05_rtl_transaction_replay.py \
            hls/m05_rolling/rtl_stress/tb_m05_rolling_axis_multi_run.sv \
            scripts/m05_rtl_multi_run_replay.py \
            tests/test_m05_rtl_multi_run_replay.py \
            src/neuromorphic_accelerator_v1/m05_execution_controller.py \
            src/neuromorphic_accelerator_v1/m05_execution_sim.py \
            src/neuromorphic_accelerator_v1/m05_execution_abi.py \
            tests/test_m05_execution_controller.py \
            tests/test_m05_execution_abi.py \
            scripts/m05_controller_native_demo.py \
            src/neuromorphic_accelerator_v1/m05_trace_commit.py \
            hls/m05_rolling/m05_rolling.hpp \
            hls/m05_rolling/m05_rolling.cpp \
            hls/m05_rolling/m05_rolling_host_cli.cpp \
            hls/m05_rolling/m05_rolling_csim_tb.cpp \
            hls/m05_rolling/m05_rolling_hls_config.cfg \
            hls/m05_stream_eval/run_m05_offline_hls.sh \
            hls/m04_lif_eval/m04_eval.cpp
