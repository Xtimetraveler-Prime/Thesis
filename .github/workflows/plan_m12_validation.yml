name: Plan M12 validation

on:
  push:
    branches:
      - agent/m12-validation-plan
    paths:
      - .github/workflows/plan_m12_validation.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-validation-plan
          fetch-depth: 0
      - name: Expand M12 plan
        run: python3 scripts/plan_m12_validation.py
      - name: Validate M12-only planning markers
        shell: bash
        run: |
          grep -Fq '| M12 | Validate FPGA against Python golden model | In progress | 2026-08-27 | — |' MILESTONES.md
          grep -Fq '### M12.1 — Build the physical FPGA trace-capture boundary' MILESTONES.md
          grep -Fq '### M12.2 — Exact single-tick Python-versus-FPGA differential validation' MILESTONES.md
          grep -Fq '### M12.3 — Multi-tick and recurrent-network physical conformance' MILESTONES.md
          grep -Fq '### M12.4 — Broad deterministic physical regression and boundary stress' MILESTONES.md
          grep -Fq '### M12.5 — Characterize the validated FPGA and assemble thesis-level evidence' MILESTONES.md
          ! grep -Fq '## M13' MILESTONES.md
      - name: Commit M12 plan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md
          git commit -m "Plan M12 physical FPGA validation"
          git push origin HEAD:agent/m12-validation-plan
