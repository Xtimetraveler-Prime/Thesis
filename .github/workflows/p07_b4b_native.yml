name: P07-B.4b read-only admission native

on:
  push:
    branches:
      - agent/v3-p07-b-scaled-physical-inference
    paths:
      - "Loihi_Digital_Twin/v3/software/p07/p07_b4b_*"
      - "Loihi_Digital_Twin/v3/software/p07/include/p07_b4b_*"
      - "Loihi_Digital_Twin/v3/tests/native/p07_b4b*"
      - "Loihi_Digital_Twin/v3/tests/test_p07_b4b_board_admission.py"
      - ".github/workflows/p07_b4b_native.yml"
  pull_request:
    paths:
      - "Loihi_Digital_Twin/v3/software/p07/p07_b4b_*"
      - "Loihi_Digital_Twin/v3/software/p07/include/p07_b4b_*"
      - "Loihi_Digital_Twin/v3/tests/native/p07_b4b*"
      - "Loihi_Digital_Twin/v3/tests/test_p07_b4b_board_admission.py"
      - ".github/workflows/p07_b4b_native.yml"

permissions:
  contents: read

jobs:
  strict-c11:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: Loihi_Digital_Twin/v3
    steps:
      - uses: actions/checkout@v4
      - name: Compile original P03 with fake Xilinx BSP and sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DP07_B4B_TEST_HOST_BSP=1 \
            -I tests/native/p07_b4b_stub \
            -I software/p07/include -I software/p03/include \
            -I software/p05/include \
            software/p03/p03_hw_adapter.c \
            software/p07/p07_b4b_board_admission.c \
            software/p07/p07_b4b_xilinx_platform.c \
            tests/native/p07_b4b_admission_harness.c \
            -o /tmp/p07_b4b_readonly
      - name: Prove only read operations and fail-closed bounds
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: /tmp/p07_b4b_readonly
