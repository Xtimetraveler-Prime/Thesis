name: M13.4 one-shot boundary hardening

on:
  push:
    branches:
      - agent/m13-4-directed-differential-probes
    paths:
      - '.github/workflows/m13_4_hardening_once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-4-directed-differential-probes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Align catalog and documentation with adapter limits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('Neuromorphic Digital Twin/references/m13_4_probe_catalog.json')
          data = json.loads(catalog_path.read_text(encoding='utf-8'))
          probes = {p['id']: p for p in data['probes']}
          for probe_id in ('P09-event-multiplicity', 'P10-recurrent-timing', 'P11-state-saturation'):
              probes[probe_id]['participation']['brian2loihi'] = 'blocked_by_m13_3'
          data['summary']['not_yet_authorized'] = (
              'No Catalyst parameter translation, repeated-identical-source Brian2Loihi transform, '
              'Brian2Loihi recurrent-route mapping, finite-width Brian2Loihi boundary transform, '
              'normalized trace comparison, four-way PASS/FAIL result, or A-H discrepancy classification '
              'is authorized until M13.3 freezes the common comparison specification.'
          )
          catalog_path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          doc_path = Path('Neuromorphic Digital Twin/docs/M13_4_DIRECTED_PROBES.md')
          doc = doc_path.read_text(encoding='utf-8')
          needle = ('The M12 references are catalog provenance only at this stage; the pre-normalization runner '
                    'does not rerun physical FPGA evidence.\n')
          addition = needle + ('\nThe existing Brian2Loihi adapter now also fails closed when a `ComparisonScenario` contains '
                    '`spike_routes`. Brian2Loihi itself supports recurrent Synapses, but the project adapter '
                    'does not yet define the graph/timing translation from the project route representation. '
                    'Repeated identical-source events are likewise rejected by the current SpikeGeneratorGroup '
                    'mapping, and explicit finite-width saturation is outside the adapter\'s current unbounded '
                    'arithmetic boundary. P09-P11 therefore remain blocked on M13.3 transforms instead of '
                    'silently substituting a different scenario.\n')
          if addition not in doc:
              if needle not in doc:
                  raise SystemExit('documentation insertion point missing')
              doc = doc.replace(needle, addition, 1)
          doc_path.write_text(doc, encoding='utf-8')
          PY
      - name: Install frozen comparison environment
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pip install -e '.[dev,compare]'
          python - <<'PY'
          import numpy, brian2
          assert numpy.__version__ == '1.26.4'
          assert brian2.__version__ == '2.9.0'
          PY
      - name: Focused M13.4 tests
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pytest -q tests/test_m13_4_directed_probes.py
          PYTHONPATH=src python examples/run_m13_4_directed_probes.py
      - name: Re-run preserved native evidence
        run: |
          cd 'Neuromorphic Digital Twin'
          rm -rf build/m13_4/pre_normalization
          PYTHONPATH=src python examples/run_m13_4_directed_probes.py \
            --run-pre-normalization-reuse build/m13_4/pre_normalization
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/m13_4/pre_normalization/manifest.json').read_text())
          assert data['directed_summary'] == {'cases': 12, 'pass': 12, 'fail': 0, 'error': 0, 'ticks': 34, 'mismatches': 0}
          assert data['weight_summary'] == {'cases': 15, 'pass': 15, 'fail': 0, 'error': 0, 'ticks': 15, 'mismatches': 0}
          assert len(data['artifacts']) == 123
          assert data['normalized_comparison_performed'] is False
          assert data['catalyst_execution_performed'] is False
          print('M13.4 preserved evidence PASS: 12/12 directed, 15/15 weights, artifacts=123')
          PY
      - name: Prove M13.3 gate remains fail closed
        run: |
          cd 'Neuromorphic Digital Twin'
          set +e
          PYTHONPATH=src python examples/run_m13_4_directed_probes.py --require-normalization
          rc=$?
          set -e
          test "$rc" -eq 4
      - name: Complete thesis regression suite
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pytest -q
      - name: Commit durable hardening and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13_4_hardening_once.yml
          git add 'Neuromorphic Digital Twin/references/m13_4_probe_catalog.json' \
                  'Neuromorphic Digital Twin/docs/M13_4_DIRECTED_PROBES.md'
          git diff --cached --check
          git commit -m 'Harden M13.4 pre-normalization adapter boundaries'
          git push origin HEAD:agent/m13-4-directed-differential-probes
