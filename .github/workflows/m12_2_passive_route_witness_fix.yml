name: Keep M12.2 route witness passive

on:
  push:
    branches:
      - agent/m12-2-single-tick-physical
    paths:
      - .github/workflows/m12_2_passive_route_witness_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-2-single-tick-physical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture existing work_target without a second RAM read
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv')
          text = p.read_text()
          old = '''                S_ROUTE_READ: begin
                    work_target                 <= route_target_mem[active_route_index[11:0]];
                    last_route_target_read_addr <= active_route_index[11:0];
                    last_route_target_read_data <= route_target_mem[active_route_index[11:0]];
                    state                       <= S_ROUTE_APPEND;
                end

                S_ROUTE_APPEND: begin
                    if (work_target >= MAX_AXONS) begin
'''
          new = '''                S_ROUTE_READ: begin
                    work_target                 <= route_target_mem[active_route_index[11:0]];
                    last_route_target_read_addr <= active_route_index[11:0];
                    state                       <= S_ROUTE_APPEND;
                end

                S_ROUTE_APPEND: begin
                    // Passive witness of the exact registered target consumed by
                    // the existing append path; this adds no route-memory read port.
                    last_route_target_read_data <= work_target;
                    if (work_target >= MAX_AXONS) begin
'''
          if old not in text:
              raise SystemExit('route witness patch anchor missing')
          p.write_text(text.replace(old, new, 1))

          t = Path('Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py')
          s = t.read_text()
          s = s.replace(
              '    assert "last_route_target_read_data <= route_target_mem[active_route_index[11:0]];" in route\n',
              '    assert "last_route_target_read_data <= work_target;" in route\n    assert "this adds no route-memory read port" in route\n'
          )
          t.write_text(s)
          PY
      - name: Run focused M12.2 regressions
        working-directory: Neuromorphic Digital Twin
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_m12_2_single_tick_conformance.py tests/test_m12_2_capture_sources.py
      - name: Commit passive witness fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv' 'Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py'
          git commit -m 'Keep M12.2 route witness passive'
          git push origin HEAD:agent/m12-2-single-tick-physical
