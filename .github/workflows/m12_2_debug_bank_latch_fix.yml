name: Fix M12.2 recurrent debug bank timing

on:
  push:
    branches:
      - agent/m12-2-single-tick-physical
    paths:
      - .github/workflows/m12_2_debug_bank_latch_fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-2-single-tick-physical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch recurrent debug bank selection
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv')
          text = route.read_text()

          old = '''    logic        bank1_mem_re;
    logic [11:0] bank1_mem_raddr;
    logic [15:0] bank1_mem_rdata;

    assign current_count = current_bank ? bank1_count : bank0_count;
    assign debug_bank0_count = bank0_count;
    assign debug_bank1_count = bank1_count;
    assign debug_rdata = debug_bank ? bank1_mem_rdata : bank0_mem_rdata;
'''
          new = '''    logic        bank1_mem_re;
    logic [11:0] bank1_mem_raddr;
    logic [15:0] bank1_mem_rdata;
    logic        debug_bank_latched;

    assign current_count = current_bank ? bank1_count : bank0_count;
    assign debug_bank0_count = bank0_count;
    assign debug_bank1_count = bank1_count;
    // The recurrent banks are synchronous memories. Hold the bank selector from
    // the accepted read request until its registered RAM data is returned;
    // callers are not required to keep debug_bank stable after debug_re falls.
    assign debug_rdata = debug_bank_latched ? bank1_mem_rdata : bank0_mem_rdata;
'''
          if old not in text:
              raise SystemExit('declaration/debug mux anchor missing')
          text = text.replace(old, new, 1)

          old = '''            debug_rvalid                 <= 1'b0;
            route_target_write_seen      <= 1'b0;
'''
          new = '''            debug_rvalid                 <= 1'b0;
            debug_bank_latched           <= 1'b0;
            route_target_write_seen      <= 1'b0;
'''
          if old not in text:
              raise SystemExit('reset anchor missing')
          text = text.replace(old, new, 1)

          old = '''                if (debug_re)
                    debug_rvalid <= 1'b1;
'''
          new = '''                if (debug_re) begin
                    debug_bank_latched <= debug_bank;
                    debug_rvalid       <= 1'b1;
                end
'''
          if old not in text:
              raise SystemExit('debug request anchor missing')
          text = text.replace(old, new, 1)
          route.write_text(text)

          test = Path('Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py')
          s = test.read_text()
          s += '''\n\ndef test_recurrent_debug_read_latches_bank_selector_for_synchronous_ram() -> None:\n    route = (RTL / "recurrent_route_queue_v1.sv").read_text(encoding="utf-8")\n    assert "logic        debug_bank_latched;" in route\n    assert "assign debug_rdata = debug_bank_latched ? bank1_mem_rdata : bank0_mem_rdata;" in route\n    assert "debug_bank_latched <= debug_bank;" in route\n    assert "callers are not required to keep debug_bank stable after debug_re falls" in route\n    assert "assign debug_rdata = debug_bank ? bank1_mem_rdata : bank0_mem_rdata;" not in route\n'''
          test.write_text(s)
          PY
      - name: Add behavioral regression testbench
        run: |
          cat > 'Neuromorphic Digital Twin/rtl/core_v1/tb/tb_m12_2_recurrent_debug_bank_latch.sv' <<'SV'
          `timescale 1ns/1ps
          module tb_m12_2_recurrent_debug_bank_latch;
              logic ap_clk = 0;
              logic ap_rst = 1;
              always #5 ap_clk = ~ap_clk;

              logic core_reset_start = 0, start = 0;
              logic [8:0] neuron_count = 1;
              logic [12:0] route_count = 1;
              logic busy, core_reset_done, done, fault;
              logic [7:0] fault_code;
              logic current_bank;
              logic [12:0] current_count, last_consumed_count, last_routed_count;
              logic [7:0] active_source;
              logic [31:0] active_route_index;
              logic route_target_write_seen;
              logic [11:0] last_route_target_write_addr, last_route_target_read_addr;
              logic [15:0] last_route_target_write_data, last_route_target_read_data;
              logic recurrent_bank_write_seen, last_recurrent_bank_write_bank;
              logic [11:0] last_recurrent_bank_write_addr;
              logic [15:0] last_recurrent_bank_write_data;
              logic route_row_we = 0;
              logic [8:0] route_row_addr = 0;
              logic [31:0] route_row_wdata = 0;
              logic route_target_we = 0;
              logic [11:0] route_target_addr = 0;
              logic [15:0] route_target_wdata = 0;
              logic spike_we = 0;
              logic [7:0] spike_addr = 0;
              logic spike_wdata = 0;
              logic debug_re = 0, debug_bank = 0;
              logic [11:0] debug_addr = 0;
              logic debug_rvalid;
              logic [15:0] debug_rdata;
              logic [12:0] debug_bank0_count, debug_bank1_count;

              recurrent_route_queue_v1 #(.MAX_NEURONS(4), .MAX_AXONS(8), .MAX_ROUTES(8), .MAX_EVENTS(8)) dut (.*);

              task automatic wr_row(input [8:0] a, input [31:0] d);
                  @(negedge ap_clk); route_row_we=1; route_row_addr=a; route_row_wdata=d;
                  @(negedge ap_clk); route_row_we=0;
              endtask
              task automatic wr_target(input [11:0] a, input [15:0] d);
                  @(negedge ap_clk); route_target_we=1; route_target_addr=a; route_target_wdata=d;
                  @(negedge ap_clk); route_target_we=0;
              endtask
              task automatic wr_spike(input [7:0] a, input logic d);
                  @(negedge ap_clk); spike_we=1; spike_addr=a; spike_wdata=d;
                  @(negedge ap_clk); spike_we=0;
              endtask

              initial begin
                  repeat (4) @(posedge ap_clk);
                  @(negedge ap_clk); ap_rst=0;
                  wr_row(0, 0);
                  wr_row(1, 1);
                  wr_target(0, 16'd1);
                  wr_spike(0, 1'b1);

                  @(negedge ap_clk); core_reset_start=1;
                  @(negedge ap_clk); core_reset_start=0;
                  wait(core_reset_done);

                  @(negedge ap_clk); start=1;
                  @(negedge ap_clk); start=0;
                  wait(done);
                  #1;
                  if (current_bank !== 1'b1 || current_count !== 13'd1)
                      $fatal(1, "route did not commit to bank1/count1");
                  if (!recurrent_bank_write_seen || last_recurrent_bank_write_bank !== 1'b1 ||
                      last_recurrent_bank_write_addr !== 12'd0 || last_recurrent_bank_write_data !== 16'd1)
                      $fatal(1, "bank write witness mismatch");

                  // Request bank1, then immediately return the live selector to
                  // bank0. The synchronous response must still come from bank1.
                  @(negedge ap_clk); debug_bank=1; debug_addr=0; debug_re=1;
                  @(negedge ap_clk); debug_re=0; debug_bank=0;
                  if (!debug_rvalid)
                      $fatal(1, "debug_rvalid was not asserted for synchronous response");
                  if (debug_rdata !== 16'd1)
                      $fatal(1, "latched-bank read mismatch expected=1 actual=%0d", debug_rdata);

                  $display("M12.2 recurrent debug bank-latch regression passed: bank1 payload survives selector release");
                  $finish;
              end
          endmodule
          SV
      - name: Run Python regressions
        working-directory: Neuromorphic Digital Twin
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_m12_2_single_tick_conformance.py tests/test_m12_2_capture_sources.py
      - name: Run RTL regression with Icarus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          mkdir -p /tmp/m12_2_bank_latch
          iverilog -g2012 -o /tmp/m12_2_bank_latch/simv \
            'Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv' \
            'Neuromorphic Digital Twin/rtl/core_v1/tb/tb_m12_2_recurrent_debug_bank_latch.sv'
          vvp /tmp/m12_2_bank_latch/simv | tee /tmp/m12_2_bank_latch/output.log
          grep -F 'M12.2 recurrent debug bank-latch regression passed' /tmp/m12_2_bank_latch/output.log
      - name: Update debug record
        run: |
          cat >> 'Neuromorphic Digital Twin/docs/M12_2_ROUTE_TARGET_DEBUG.md' <<'MD'

          ## Recurrent-bank write and duplicate-read localization

          The next physical witness proved the actual recurrent-bank write boundary was correct:

          ```text
          M12.2 recurrent-bank write witness case 7: write_seen=1 bank=1 addr=0 data=1
          ```

          A host-only duplicate read of the committed routed entry returned:

          ```text
          M12.2 case07 recurrent-bank duplicate read: bank=1 space=6 addr=0 first=0 second=0
          ```

          The write datapath therefore reaches bank 1, address 0, with payload 1 exactly as expected. The repeated zero read ruled out a one-off stale host sample but did not rule out a bank-selection alignment bug inside the synchronous debug interface.

          Source inspection identified that bug: `debug_rdata` selected `bank0_mem_rdata` versus `bank1_mem_rdata` using the live `debug_bank` request input even though the RAM output is synchronous. The M12 trace bridge only drives bank 1 during the request pulse; by the response cycle the live selector returns to bank 0, so a correct bank-1 memory response is hidden behind the bank-0 mux output.

          The correction latches `debug_bank` when `debug_re` is accepted and uses that registered selector for `debug_rdata`. This changes only observability/readback alignment; recurrent routing, queue writes, counts, and architectural semantics are unchanged. A dedicated RTL regression releases the live selector immediately after a bank-1 request and requires the subsequent synchronous response to remain bank 1.

          Status: **root cause identified; RTL readback fix implemented, pending physical M12.2 verification**.
          MD
      - name: Commit fix and regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'Neuromorphic Digital Twin/rtl/core_v1/recurrent_route_queue_v1.sv' \
            'Neuromorphic Digital Twin/rtl/core_v1/tb/tb_m12_2_recurrent_debug_bank_latch.sv' \
            'Neuromorphic Digital Twin/tests/test_m12_2_capture_sources.py' \
            'Neuromorphic Digital Twin/docs/M12_2_ROUTE_TARGET_DEBUG.md'
          git commit -m 'Fix recurrent debug bank selection timing'
          git push origin HEAD:agent/m12-2-single-tick-physical
