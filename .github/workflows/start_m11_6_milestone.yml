name: Start M11.6 milestone

on:
  push:
    branches:
      - agent/m11-6-bitstream-hardware-smoke
    paths:
      - .github/workflows/start_m11_6_milestone.yml

permissions:
  contents: write

jobs:
  update_milestones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-6-bitstream-hardware-smoke
          fetch-depth: 0
      - name: Patch milestone tracker
        run: python3 scripts/start_m11_6_milestone.py
      - name: Commit milestone start
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md
          git commit -m "Start M11.6 physical bitstream milestone"
          git push origin HEAD:agent/m11-6-bitstream-hardware-smoke
