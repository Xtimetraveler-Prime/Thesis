name: Generate M12.2 Vivado project Tcl

on:
  push:
    branches:
      - agent/m12-2-single-tick-physical
    paths:
      - .github/workflows/generate_m12_2_project.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-2-single-tick-physical
          fetch-depth: 0
      - run: python3 scripts/generate_m12_2_project_tcl.py
      - name: Validate intended substitutions
        shell: bash
        run: |
          test -f "Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_2_project.tcl"
          grep -Fq 'set project_name "neuromorphic_twin_m12_2"' "Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_2_project.tcl"
          grep -Fq 'set capture_module "m12_2_single_tick_capture_controller_bd_v1"' "Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_2_project.tcl"
          grep -Fq 'CONFIG.C_NUM_PROBE_IN {26}' "Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_2_project.tcl"
          grep -Fq 'CONFIG.C_NUM_PROBE_OUT {6}' "Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_2_project.tcl"
      - name: Commit generated project source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate_m12_2_project.yml scripts/generate_m12_2_project_tcl.py
          git add "Neuromorphic Digital Twin/rtl/core_v1/vivado/create_m12_2_project.tcl"
          git commit -m "Add M12.2 Vivado project flow"
          git push origin HEAD:agent/m12-2-single-tick-physical
