name: Finalize M13.1 local validation

on:
  push:
    branches:
      - agent/m13-1-pin-catalyst-methodology
    paths:
      - scripts/finalize_m13_1_local_validation.py
      - .github/workflows/m13_1_local_close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-1-pin-catalyst-methodology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/finalize_m13_1_local_validation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md 'Neuromorphic Digital Twin/docs/M13_1_REFERENCE_BASELINE.md'
          git diff --cached --check
          git commit -m "Record independent M13.1 local validation"
          git push origin HEAD:agent/m13-1-pin-catalyst-methodology
