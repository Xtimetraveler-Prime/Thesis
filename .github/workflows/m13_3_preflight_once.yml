name: M13.3 one-shot normalization preflight

on:
  push:
    branches:
      - agent/m13-3-normalized-comparison-interface
    paths:
      - '.github/workflows/m13_3_preflight_once.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-3-normalized-comparison-interface
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen project comparison runtime
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pip install -e '.[dev,compare]'
          python - <<'PY'
          import importlib.metadata
          import brian2
          import numpy
          assert numpy.__version__ == '1.26.4', numpy.__version__
          assert brian2.__version__ == '2.9.0', brian2.__version__
          assert importlib.metadata.version('brian2-loihi') == '0.5.2'
          print('M13.3 comparison runtime PASS')
          PY

      - name: Reconstruct pinned Catalyst SDK
        run: |
          rm -rf /tmp/m13-catalyst-n1
          git clone -q https://github.com/catalyst-neuromorphic/catalyst-n1.git /tmp/m13-catalyst-n1
          git -C /tmp/m13-catalyst-n1 checkout -q --detach 1806bb4b4114d7671e5648fa75b7b83b3a8d5543
          test "$(git -C /tmp/m13-catalyst-n1 rev-parse HEAD)" = '1806bb4b4114d7671e5648fa75b7b83b3a8d5543'
          test "$(git -C /tmp/m13-catalyst-n1 hash-object sdk/neurocore/simulator.py)" = '281b75730357fe9e302e4570c80818cba9316730'
          test "$(git -C /tmp/m13-catalyst-n1 hash-object rtl/scalable_core_v2.v)" = 'c21c9c0256b37b94e78a7eb49dfd3d4303e93f0b'
          test -z "$(git -C /tmp/m13-catalyst-n1 status --porcelain)"
          python -m pip install -e /tmp/m13-catalyst-n1/sdk
          python - <<'PY'
          import neurocore
          assert neurocore.__version__ == '1.0.0'
          print('M13.3 Catalyst pin PASS')
          PY

      - name: Focused M13.3 contract tests
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pytest -q tests/test_m13_3_normalization.py
          PYTHONPATH=src python examples/run_m13_3_normalization.py

      - name: Execute translation-smoke bundle
        run: |
          cd 'Neuromorphic Digital Twin'
          rm -rf build/m13_3/translation_smoke
          PYTHONPATH="src:/tmp/m13-catalyst-n1/sdk" \
            python examples/run_m13_3_normalization.py \
              --output build/m13_3/translation_smoke \
              --execute-catalyst-cpu
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('build/m13_3/translation_smoke')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['schema'] == 'neuromorphic-twin-m13-translation-smoke-v1'
          assert manifest['normalization_schema'] == 'neuromorphic-twin-m13-normalization-v1'
          assert manifest['normalization_status'] == 'frozen'
          assert manifest['scenario_count'] == 4
          assert manifest['comparison_performed'] is False
          assert manifest['discrepancy_classification_performed'] is False

          records = {item['name']: item for item in manifest['cases']}
          for name in (
              'm13-3-threshold-boundary',
              'm13-3-refractory-release',
              'm13-3-signed-drive',
          ):
              assert records[name]['project_executed'] is True
              assert records[name]['brian2loihi_executed'] is True
              assert records[name]['catalyst_backend'] == 'catalyst_cpu_sync'
              assert records[name]['catalyst_executed'] is True
          cuba = records['m13-3-isolated-cuba-decay']
          assert cuba['project_executed'] is True
          assert cuba['brian2loihi_executed'] is True
          assert cuba['catalyst_backend'] == 'catalyst_rtl_cuba'
          assert cuba['catalyst_executed'] is False
          assert (root / 'm13-3-isolated-cuba-decay/catalyst.native-plan.json').is_file()

          threshold = json.loads(
              (root / 'm13-3-threshold-boundary/catalyst.native.json').read_text()
          )
          assert threshold['ticks'][0]['potential_after'] == [256]
          assert threshold['ticks'][0]['spikes'] == []
          assert threshold['ticks'][1]['potential_after'] == [0]
          assert threshold['ticks'][1]['spikes'] == [0]

          refractory = json.loads(
              (root / 'm13-3-refractory-release/catalyst.native.json').read_text()
          )
          spike_ticks = [
              t['native_tick'] for t in refractory['ticks'] if t['spikes']
          ]
          assert spike_ticks == [0, 3]

          signed = json.loads(
              (root / 'm13-3-signed-drive/catalyst.native.json').read_text()
          )
          assert signed['ticks'][0]['potential_after'] == [128]
          assert signed['ticks'][0]['spikes'] == []
          print(
              'M13.3 translation-smoke PASS: '
              f"cases={manifest['scenario_count']} artifacts={len(manifest['artifacts'])}"
          )
          PY

      - name: Complete thesis regression suite
        run: |
          cd 'Neuromorphic Digital Twin'
          python -m pytest -q

      - name: Record implementation checkpoint and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('MILESTONES.md')
          text = p.read_text(encoding='utf-8')
          old = '''### M13.3 — Define a common behavioral subset and normalized comparison interface

**Status:** Planned
'''
          new = '''### M13.3 — Define a common behavioral subset and normalized comparison interface

**Status:** In progress  
**Started:** 2026-09-09  
**Repository evidence:** branch `agent/m13-3-normalized-comparison-interface`; frozen normalization implementation and CI preflight complete, pending independent local validation
'''
          if old not in text:
              raise SystemExit('M13.3 planned status block not found')
          text = text.replace(old, new, 1)

          marker = '''#### Pass boundary

A frozen comparison specification can generate or translate at least a small directed corpus into every participating implementation for which the behavior is genuinely supported, and it clearly marks non-comparable fields rather than forcing artificial equality.
'''
          addition = marker + '''
#### Implementation checkpoint

The candidate M13.3 implementation freezes `references/m13_3_normalization_spec.json` (`neuromorphic-twin-m13-normalization-v1`, version 1) before M13.4 Catalyst differential execution. It defines exact/transformed/qualitative/non-comparable field policy, strict-threshold `T+1` normalization for Catalyst, semantic refractory `R-1` parameter normalization, final-effective-weight mapping, the signed-16-bit shared observation envelope, logical-identifier mapping, restricted CPU direct-drive scenarios, and the isolated-impulse Catalyst RTL CUBA one-native-tick staging transform. General multi-input CUBA update order is deliberately not normalized away.

The executable interface in `src/neuromorphic_twin/comparison/m13_normalization.py` generates native plans for the project, Brian2Loihi, Catalyst synchronous CPU, and Catalyst RTL CUBA boundaries and preserves native plus normalized artifacts. The four-case translation-smoke corpus covers threshold, refractory release, signed drive, and isolated CUBA decay. A clean CI reconstruction verified the pinned Catalyst commit and key source blobs, executed the three Catalyst CPU-applicable plans, generated the Catalyst RTL CUBA native plan, materialized project/Brian2Loihi traces, and passed the complete thesis regression suite. The comparison runtime is pinned to NumPy 1.26.4, Brian2 2.9.0, and Brian2Loihi 0.5.2 to eliminate the previously observed Class-H dependency incompatibility.

M13.3 remains **In progress** until the requested independent local validation is reproduced. No project computational behavior, HLS, RTL, or M12 physical evidence changed.
'''
          if marker not in text:
              raise SystemExit('M13.3 pass-boundary marker not found')
          text = text.replace(marker, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13_3_preflight_once.yml
          git add MILESTONES.md
          git diff --cached --check
          git commit -m 'Record validated M13.3 implementation checkpoint'
          git push origin HEAD:agent/m13-3-normalized-comparison-interface
