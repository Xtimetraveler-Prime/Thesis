name: Mark M13.1 in progress

on:
  push:
    branches:
      - agent/m13-1-pin-catalyst-methodology
    paths:
      - scripts/mark_m13_1_in_progress.py
      - .github/workflows/m13_1_status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-1-pin-catalyst-methodology
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/mark_m13_1_in_progress.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONES.md
          git diff --cached --check
          git commit -m "Mark M13.1 reference audit in progress"
          git push origin HEAD:agent/m13-1-pin-catalyst-methodology
