name: Neuromorphic Accelerator v1 M07.1 cache-policy baselines (NO BOARD)
on:
  push:
    paths:
      - "Neuromorphic_Accelerator/v1/**"
      - ".github/workflows/neuromorphic_accelerator_m07_host_only.yml"
  pull_request:
    paths:
      - "Neuromorphic_Accelerator/v1/**"
      - ".github/workflows/neuromorphic_accelerator_m07_host_only.yml"
  workflow_dispatch:

jobs:
  m07-source-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: Neuromorphic_Accelerator/v1
    steps:
      - uses: actions/checkout@v4
      - name: Pinned source provenance and Python syntax (NO VIVADO OR FPGA)
        run: |
          git rev-parse HEAD
          python3 --version
          python3 -m compileall -q src scripts tests
      - name: Direct and M06 LRU policy parity, faults and negative protocol tests
        run: python3 -m unittest discover -s tests -p 'test_m07*.py' -v
      - name: Independent accepted M02/M03/M06 source regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_m02*.py' -v
          python3 -m unittest discover -s tests -p 'test_m03*.py' -v
          python3 -m unittest discover -s tests -p 'test_m06*.py' -v
      - name: Synthetic 4-case locality x policy report (NOT AXI OR PHYSICAL DDR)
        run: |
          python3 scripts/m07_cache_baseline.py --output "$RUNNER_TEMP/m07_cache_baseline_source_only.json"
          python3 - "$RUNNER_TEMP/m07_cache_baseline_source_only.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data=json.load(f)
          assert data["role_isomorphic_checked"] is True
          assert data["physical_hardware_measured"] is False
          assert data["vendor_hls_amd_rtl_executed"] is False
          for loc in ("clustered","dispersed"):
              direct=data["results"][loc]["direct"]
              lru=data["results"][loc]["lru"]
              assert direct["canonical_trace_sha256"]==lru["canonical_trace_sha256"]
              assert direct["state_cache_counters"]["misses"]==direct["evaluations"]
              assert lru["state_transfer_bytes"]<=direct["state_transfer_bytes"]
              assert direct["simulated_service_cycles"] is None
              print("M07_SOURCE_ONLY",loc,"direct_bytes",direct["state_transfer_bytes"],
                    "lru_bytes",lru["state_transfer_bytes"])
          PY
      - name: Preserve source-only M07 policy artifact (NOT HARDWARE EVIDENCE)
        uses: actions/upload-artifact@v4
        with:
          name: m07-1-model-only-direct-vs-lru
          path: ${{ runner.temp }}/m07_cache_baseline_source_only.json
          if-no-files-found: error
          retention-days: 30
