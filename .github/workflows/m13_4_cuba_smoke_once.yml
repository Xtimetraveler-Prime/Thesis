name: M13.4 Catalyst CUBA isolation smoke once
on:
  push:
    branches: [agent/m13-4-directed-differential-probes]
    paths: ['.github/workflows/m13_4_cuba_smoke_once.yml']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-4-directed-differential-probes
          fetch-depth: 0
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          cd 'Neuromorphic Digital Twin'
          python3 -m pip install -e '.[dev,compare]'
          bash scripts/fetch_m13_1_catalyst.sh
          bash scripts/run_m13_4_catalyst_cuba_probes.sh
          grep -q '^M13_4_CUBA|case=negative|native_tick=0|current=-64|voltage=0|refractory=0|spike=0$' build/m13_4/catalyst-rtl/native.log
      - if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13_4_cuba_smoke_once.yml
          git commit -m 'Remove temporary M13.4 CUBA isolation smoke'
          git push origin HEAD:agent/m13-4-directed-differential-probes
